"Rengat","Rengat Barat","Seberida","Batang Gansal","Lirik","Pasir Penyu","Peranap","Kelayang","Rakit Kulim","Batang Cenaku","Sungai Lala","Lubuk Batu Jaya","Kuala Cenaku","Siberida"],k1=["Berbasis Budaya Melayu","Berbasis Alam Sungai Indragiri","Berbasis Kebun Sawit/Karet","Berbasis Adat Talang Mamak","Kewirausahaan Songket"],E1=["Sungai Indragiri Sahabatku","Aku Cinta Indragiri Hulu","Warisan Songketku","Panen Sawit","Adat Talang Mamak","Kebun Karet Lestari","Alamku Sungai Indragiri","Pasar Tradisional Rengat","Bolu Berendam Tradisi Melayu","Kuliner Melayu Indragiri Hulu"],_1=[{id:"nabp",label:"Nilai Agama & Budi Pekerti",short:"NABP"},{id:"jati",label:"Jati Diri",short:"Jati Diri"},{id:"steam",label:"Literasi STEAM",short:"STEAM"}],Ms={nabp:"Anak mengenal dan memahami nilai-nilai agama yang dianut, menunjukkan sikap kasih sayang, toleransi, kejujuran, serta kebiasaan berdoa dan bersyukur. Kontekstual Inhu: Menghormati tradisi Nandung/Dundung Melayu sebagai ungkapan syukur kepada Sang Pencipta.",jati:"Anak menunjukkan kesadaran akan jati diri sebagai anak Melayu Indragiri Hulu, mengenal keluarga, lingkungan sekitar, bangga terhadap budaya songket, bahasa Melayu Inhu, dan adat Talang Mamak. Mandiri, tanggung jawab, dan gotong royong.",steam:"Anak mengembangkan literasi awal, numerasi, sains sederhana, teknologi sederhana, rekayasa (engineering), seni, dan matematika melalui eksplorasi lingkungan alam Sungai Indragiri, kebun sawit/karet, dan artefak budaya lokal."},C1={"Aku Cinta Indragiri Hulu":{pembukaan:"Salam, doa, menyanyikan Nandung Indragiri Hulu 'La ilaha illallah tidurlah anak...' (3'), apersepsi: 'Siapa yang pernah lihat kain cantik berkilau dipakai Bunda saat kondangan? Itu Songket Inhu! Motifnya seperti mahkota buah, namanya Tampuk Manggis, dari buah manggis yang banyak di kebun kita.'",inti:`1. Amati (10'): Guru tunjukkan songket asli motif tampuk manggis, anak sentuh dan amati kilau benang emas.
2. Makna (15'): Cerita asal motif dari buah manggis yang banyak tumbuh di Inhu, bentuknya seperti mahkota. Tunjukkan buah manggis asli dan daun manggis.
3. Eksplorasi (15'): Anak mengelompokkan biji manggis asli, menghitung 5 biji (matematika), membandingkan ukuran daun.
4. Kreasi (20'): Kolase motif tampuk manggis dengan daun kering, kertas emas, biji-bijian.`,penutup:"Refleksi dengan lingkaran: 'Tadi kita buat apa? Apa warna benang emas songket?', beri bintang penghargaan, doa pulang, pesan 'Jaga warisan Inhu ya!'",bahan:["Kain songket asli Inhu motif tampuk manggis","Daun manggis kering","Kertas emas","Lem","Biji manggis asli","Foto kebun manggis Inhu"]},"Sungai Indragiri Sahabatku":{pembukaan:"Nandung pagi: guru mendendangkan pantun Melayu Inhu tentang sungai. Apersepsi: 'Siapa pernah lihat Sungai Indragiri dari tepi Rengat?' Mindful breathing 1 menit mendengarkan suara air (audio).",inti:"Eksplorasi: anak mengamati foto/ miniatur Sungai Indragiri, memilah sampah organik-anorganik (Meaningful). Main peran: menjadi penjaga sungai, menyaring air keruh dengan pasir & kain. Kolase aliran sungai dari daun sawit kering. Diskusi: mengapa sungai harus bersih? Koneksi ke kehidupan nelayan Seberida.",penutup:"Refleksi lingkaran: anak menceritakan satu hal yang dipelajari tentang sungai. Guru menutup dengan pantun penutup dan doa bersama. Joyful: tepuk 'Sungai Bersih'.",bahan:["Daun sawit kering","Biji karet","Pasir halus","Botol plastik bekas","Kain perca songket","Foto Sungai Indragiri"]},"Warisan Songketku":{pembukaan:"Pembukaan dengan musik Rentak Bulian. Guru memakai selempang songket motif Tampuk Manggis. Anak menebak motif dari kain.",inti:"Amati: anak mengamati motif songket Indragiri Hulu (Tampuk Manggis, Rentak Bulian, Pucuk Rebung). Tiru: menjiplak pola di kertas. Eksplorasi: mewarnai motif dengan pewarna alam (kunyit, daun). Kreasi: kolase benang kuning songket di kertas. Meaningful: wawancara dengan penenun di Pasar Rengat (video).",penutup:"Pameran karya songket mini. Refleksi: 'Bagaimana perasaan membuat motif sendiri?' Bernyanyi lagu Melayu.",bahan:["Kain songket motif Tampuk Manggis","Benang kuning","Kertas HVS tebal","Pewarna alami kunyit","Lem","Gunting tumpul"]},"Panen Sawit":{pembukaan:"Cerita pagi: Pak Petani dari Lirik panen sawit. Hitung janjang dengan lagu.",inti:"Numerasi: menghitung biji sawit / biji karet (1-20) menggunakan keranjang. Sains: mengamati tekstur daun sawit berduri, tempurung. Seni: cap daun sawit dengan cat. Kewirausahaan: simulasi jual beli sawit di pasar mini. Literasi: menulis kata 'SAWIT' dari biji.",penutup:"Refleksi: mensyukuri rezeki kebun. Doa petani. Bersih-bersih alat.",bahan:["Daun sawit","Biji karet/sawit tiruan","Tempurung kelapa","Cat air","Keranjang anyam","Timbangan mainan"]},"Kuliner Melayu Indragiri Hulu":{pembukaan:"Assalamualaikum anak-anak hebat Melayu Inhu! Hari ini Ibu bawa kue istimewa dari Rengat, Bolu Berendam / Bolu Beghondam. Dulu hanya untuk Raja dan bangsawan Kerajaan Indragiri. Cium aromanya harum pandan dan manis gula merah.",inti:`1. Amati (10'): Guru tunjukkan Bolu Berendam asli, bentuk kapal kecil berendam kuah gula merah.
2. Makna (15'): Cerita sejarah Bolu Berendam dari Rengat, hidangan istana, melambangkan manisnya adat Melayu.
3. Eksplorasi (15'): Menebak bahan tepung, telur, gula merah, santan, pandan. Hitung 6 buah bolu. Eksperimen menyerap kuah.
4. Kreasi (20'): Membuat Bolu Berendam mainan dari plastisin coklat & hijau pandan, hias meses gula merah.`,penutup:"Refleksi: Jadi koki cilik Melayu, cerita rasa manis, janji jaga resep nenek moyang, berbagi seperti adat Melayu, reward Koki Melayu Cilik Inhu.",bahan:["Bolu Berendam asli Rengat","Plastisin coklat & hijau pandan","Piring plastik","Kuah gula merah mainan","Daun pandan asli","Foto Istana Rengat","Celemek koki cilik"]},"Bolu Berendam Tradisi Melayu":{pembukaan:"Assalamualaikum anak-anak hebat Melayu Inhu! Hari ini Ibu bawa kue istimewa dari Rengat, Bolu Berendam / Bolu Beghondam. Dulu hanya untuk Raja dan bangsawan Kerajaan Indragiri.",inti:"Amati bentuk kapal kecil berendam kuah gula merah, makna sejarah istana Rengat, eksplorasi hitung 6 bolu dan sains menyerap, kreasi plastisin coklat-hijau.",penutup:"Refleksi koki cilik Melayu, cerita rasa manis, janji jaga resep, berbagi, bintang Koki Melayu Cilik.",bahan:["Bolu Berendam asli","Plastisin coklat","Piring plastik","Kuah gula merah","Daun pandan","Foto Istana Rengat"]}},z1={pembukaan:"Pembukaan mindful: salam, doa, Nandung/Dundung Melayu 3 menit untuk kesiapan belajar. Apersepsi kontekstual Inhu & pertanyaan pemantik rasa ingin tahu.",inti:"Inti Deep Learning: (1) Amati - eksplorasi benda nyata dari lingkungan Inhu (Meaningful), (2) Tiru & Eksplorasi - bermain aktif kelompok kecil dengan diferensiasi, (3) Kreasi Joyful - hasilkan karya personal (kolase, cerita, gerak). Guru fasilitasi dengan pertanyaan terbuka.",penutup:"Penutup reflektif: anak menyampaikan perasaan dengan kartu emoji, guru memberikan apresiasi, pesan moral kearifan lokal Inhu, dan rencana besok.",bahan:["Daun sawit","Biji karet","Kain songket","Tempurung","Tanah liat Sungai Indragiri","Daun pisang"]},Us=[{id:"songket",title:"Motif Songket Tampuk Manggis",emoji:"\uD83D\uDC58",short:"Warisan Budaya",usia:"5-6",badge:"Sudah Ada • 5-6 Th",desc:"Mengenal mahkota manggis sebagai simbol kesuburan Melayu Inhu. Kolase daun & kertas emas.",color:"from-[#FFF8E1] to-[#FFECB3]",borderActive:"border-[#FFC107]",rppm:{temaBesar:"Aku Cinta Indragiri Hulu",topikMingguan:"Motif Songket Tampuk Manggis - Warisan Indragiri Hulu",minggu:"Minggu ke-2 November 2026",tujuan:"Anak mengenal warisan budaya songket motif tampuk manggis sebagai identitas Melayu Indragiri Hulu, menunjukkan rasa bangga, mengenal asal usul dari buah manggis di kebun Inhu, dan mampu membuat kreasi kolase motif dengan gembira (Jati Diri + STEAM Seni)"},rpph:{hari:"Senin",tanggal:"2026-11-18",tema:"Aku Cinta Indragiri Hulu",subtema:"Motif Songket Tampuk Manggis - Warisan Indragiri Hulu",tujuan:"Melalui kegiatan mengamati kain songket, anak mampu mengidentifikasi motif tampuk manggis (Mindful), menghubungkan motif dengan tumbuhan manggis di kebun Inhu (Meaningful), dan membuat kreasi kolase dengan gembira (Joyful)",mindAction:"Mindful (5'): Tarik napas, dengarkan Nandung Indragiri Hulu 'La ilaha illallah tidurlah anak...', fokus amati kilau benang emas songket. Guru: 'Diam sejenak, lihat betapa cantiknya kilau emas ini seperti matahari pagi di kebun manggis Inhu.'",meaningAction:"Meaningful (15'): Cerita asal motif tampuk manggis dari buah manggis yang melimpah di Inhu, bentuknya seperti mahkota melambangkan kesuburan alam Melayu. Hubungkan dengan pengalaman anak: 'Siapa pernah makan buah manggis ungu manis dari kebun? Di bawah buah ada mahkota, itulah Tampuk Manggis!'",joyfulAction:"Joyful (20'): Kreasi kolase motif tampuk manggis dengan daun kering, kertas emas, biji-bijian. Anak bebas memilih bahan, memberi nama 'Songketku Karya...', pamerkan dengan bangga, bernyanyi Rentak Bulian.",pembukaan:"Salam, doa, menyanyikan Nandung Indragiri Hulu 'La ilaha illallah tidurlah anak...' (3'), apersepsi: 'Siapa yang pernah lihat kain cantik berkilau dipakai Bunda saat kondangan? Itu Songket Inhu! Motifnya seperti mahkota buah, namanya Tampuk Manggis, dari buah manggis yang banyak di kebun kita.' (Mindful - membangkitkan rasa bangga).",inti:`1. Amati (10'): Guru tunjukkan songket asli motif tampuk manggis, anak sentuh dan amati kilau benang emas, tekstur lembut, warna kuning keemasan. Guru: 'Sentuh perlahan, bagaimana rasanya? Berkilau ya?'
2. Makna (15'): Cerita asal motif dari buah manggis yang banyak tumbuh di Inhu, bentuknya seperti mahkota di bawah buah manggis. Tunjukkan buah manggis asli, daun manggis hijau tua, foto kebun manggis Inhu. Jelaskan makna: melambangkan kesuburan alam Melayu, dulunya hanya dipakai bangsawan Melayu.
3. Eksplorasi (15'): Anak mengelompokkan biji manggis asli, menghitung 5 biji (matematika), membandingkan bentuk daun manggis, mengurutkan dari kecil ke besar. Tugas STEAM: hitung 5 biji = 5 mahkota tampuk manggis.
4. Kreasi (20'): Kolase motif tampuk manggis dengan daun kering, kertas emas, biji-bijian di atas pola yang sudah digambar guru. Anak memilih: mau pakai daun atau kertas emas? Tempel, beri lem, susun melingkar seperti mahkota.`,penutup:"Refleksi dengan lingkaran: 'Tadi kita buat apa? Apa warna benang emas songket? Dari buah apa motif ini?' Beri bintang penghargaan 'Bintang Penjaga Warisan Inhu', doa pulang bersama, pesan: 'Jaga warisan Inhu ya! Besok kita pamerkan karya di dinding kelas untuk Festival Songket Inhu.' (Joyful).",bahan:["Kain songket asli Inhu motif tampuk manggis","Daun manggis kering","Kertas emas / krayon emas","Lem dan gunting tumpul","Biji manggis asli (5 buah per anak)","Foto kebun manggis Inhu"],diferensiasi:"Anak yang cepat: membuat 2 motif (tampuk manggis + pucuk rebung) dengan variasi bahan dan menuliskan nama karyanya. Anak perlu bantuan: menempel pada pola yang sudah digambar guru dengan pendampingan, menggunakan lem stick yang mudah. Visual: kartu motif tampuk manggis besar. Auditori: cerita Nandung & asal-usul manggis. Kinestetik: kolase langsung dengan daun dan biji asli.",asesmen:"Checklist observasi: (1) Anak mampu menyebutkan motif songket Inhu tampuk manggis dan pucuk rebung, (2) Motorik halus: mampu menempel kolase dengan rapi, (3) Kognitif: menghitung 5 biji manggis, (4) Bahasa: menceritakan kembali makna motif, (5) Jati Diri: menunjukkan rasa bangga budaya Inhu dengan memamerkan karya. Dokumentasi: foto karya + catatan anekdot."},lkpd:{judul:"LKPD Deep Learning - Aku Pembuat Motif Tampuk Manggis",usia:"5-6",tujuan:"Mengenal warisan budaya songket dan melatih motorik halus melalui kolase motif tampuk manggis - Jati Diri & STEAM Seni",amati:"Amati: Lihat gambar songket motif tampuk manggis - Apa bentuknya seperti mahkota? Perhatikan kilau benang emas, warna kuning keemasan, dan bentuk mahkota di bawah buah manggis. Sentuh kain, rasakan lembutnya.",tiru:"Tiru: Jiplak pola tampuk manggis dengan krayon emas. Ikuti garis titik-titik mahkota manggis yang sudah digambar guru, tebalkan dengan krayon emas mengkilap.",eksplorasi:"Eksplorasi: Tempelkan daun kering dan biji manggis pada pola. Susun biji membentuk lingkaran mahkota, hitung 5 biji. Coba variasi: daun di pinggir, kertas emas di tengah.",kreasi:"Kreasi: Warnai dan beri nama karyamu 'Songketku Karya...' dengan kertas emas dan daun. Tempel di kertas HVS tebal, tulis namamu, pamerkan di dinding kelas Pameran Warisan Inhu.",tugas:`1. Kolase motif tampuk manggis dengan daun kering & kertas emas (motorik halus)
2. Menghitung jumlah biji manggis yang ditempel: 1-5 (matematika - STEAM)
3. Menceritakan kembali makna motif tampuk manggis: 'Motif ini dari buah manggis di kebun Inhu, melambangkan kesuburan alam Melayu' (bahasa & Jati Diri)`,observasi:["☐ Mengenal motif tampuk manggis & pucuk rebung","☐ Motorik halus: menempel & menjiplak dengan rapi","☐ Mampu bercerita tentang asal motif dari buah manggis","☐ Bangga budaya Inhu: memamerkan karya dengan senyum"],refleksi:"Lingkari emoji: \uD83D\uDE0A Senang / \uD83D\uDE10 Biasa / \uD83D\uDE22 Sedih - Alasan: ... (Contoh: \uD83D\uDE0A Senang karena bisa buat mahkota manggis seperti Bunda pakai songket! / \uD83D\uDE10 Biasa karena lemnya lengket)",catatan:"Motif tampuk manggis diambil dari buah manggis yang melimpah di Indragiri Hulu, melambangkan kesuburan alam Melayu. Daun manggis hijau tua mengkilap, buah ungu kehitaman, di bawah buah terdapat mahkota berbentuk bintang - itulah inspirasi penenun songket Inhu.",ilustrasiPrompt:"Ilustrasi anak PAUD Melayu baju teluk belanga kuning emas, membuat kolase motif tampuk manggis dengan daun kering dan kertas emas, di meja ada buah manggis asli 5 buah, background kebun manggis Indragiri Hulu dan kain songket berkilau motif tampuk manggis, gaya flat colorful ceria, warna hijau sawit #2E7D32 dan kuning songket #FFC107"}},{id:"sawit",title:"Panen Sawit - Berkah Kebun Inhu",emoji:"\uD83C\uDF34",short:"Ekonomi Keluarga",usia:"4-5",badge:"BARU • 4-5 Th",desc:"Siklus sawit dari buah ke minyak CPO, motorik kasar panen, hitung 10 tandan. Relevan untuk Lirik & Rengat Barat.",color:"from-[#E8F5E9] to-[#C8E6C9]",borderActive:"border-[#2E7D32]",rppm:{temaBesar:"Panen Sawit",topikMingguan:"Panen Sawit Berkah Kebun Inhu",minggu:"Minggu ke-1 Desember 2026",tujuan:"Anak mengenal sawit sebagai sumber rezeki keluarga Inhu, memahami siklus dari buah hingga minyak (CPO), melatih motorik kasar memanen, numerasi 1-10, serta menunjukkan rasa syukur atas berkah kebun Inhu (NABP, Jati Diri, STEAM)"},rpph:{hari:"Selasa",tanggal:"2026-12-02",tema:"Panen Sawit",subtema:"Panen Sawit Berkah Kebun Inhu",tujuan:"Mengenal siklus sawit dari buah hingga minyak, melatih motorik kasar panen, rasa syukur (Mindful, Meaningful, Joyful) - Anak mampu menghitung 10 buah sawit dan mensyukuri rezeki kebun Inhu",mindAction:"Mindful (5'): Tarik napas, dengarkan Nandung syukur petani sawit. Guru: 'Tarik napas dalam... hembuskan... Kita bersyukur hari ini karena kebun sawit Inhu memberi rezeki untuk ayah dan ibu. Siapa yang mau cerita ayahnya kerja di kebun?'",meaningAction:"Meaningful (15'): Cerita sawit sumber rezeki keluarga Inhu, banyak di Inhu sebagai penghasil CPO (Crude Palm Oil). Sawit tinggi menjulang di Seberida & Lirik, buahnya merah-hitam berkumpul jadi tandan. Dari buah diperas jadi minyak goreng yang dipakai Bunda. Hubungkan dengan kehidupan: Ayah panen, dijual, uang untuk beli songket.",joyfulAction:"Joyful (20'): Permainan memanen bola warna merah-hitam simulasi sawit. Anak pakai topi petani, angkut keranjang, masukkan 10 buah sambil berhitung riang. Kreasi cap tangan jadi pelepah sawit dengan cat hijau, kolase biji sawit asli. Lagu: 'Panen sawit... panen sawit... di kebun Inhu yang luas!'",pembukaan:"Doa syukur atas rezeki kebun Inhu + Nandung Melayu 2 menit + apersepsi: 'Siapa ayahnya kerja di kebun sawit? Sawit itu pohon tinggi banyak di Seberida dan Lirik, buahnya merah-hitam, dikumpulkan jadi tandan besar. Hari ini kita jadi petani sawit cilik Inhu!'",inti:`1. Amati (10'): Guru tunjukkan tandan sawit mini (mainan) & daun sawit asli berduri. Anak cium aroma buah, sentuh tekstur kasar, amati warna merah-hitam mengkilap. Guru: 'Lihat tandan ini, berat ya? Satu tandan bisa ada 100 buah!'
2. Makna (15'): Cerita sawit sumber rezeki keluarga Inhu, banyak di Inhu sebagai penghasil CPO terbesar Riau. Jelaskan alur: bunga -> buah -> tandan -> pabrik -> minyak goreng. Kaitkan dengan pekerjaan ayah di kebun Rengat Barat & Lirik.
3. Eksplorasi (15'): Permainan memanen bola warna merah-hitam (simulasi buah sawit). Anak dibagi 3 kelompok, memanen dari pohon tiruan, masukkan keranjang, hitung 10 buah (numerasi). Guru: 'Coba hitung, sudah 10 belum? 1,2,3...10! Pintar, seperti petani hebat!'
4. Kreasi (20'): Cap tangan jadi pelepah sawit dengan cat hijau di kertas coklat. Tempelkan biji sawit asli di ujung jari. Beri nama 'Kebunku di Inhu'. Anak bebas memilih: cap tangan kanan/kiri, tambah daun kering.`,penutup:"Refleksi melingkar: 'Tadi jadi petani sawit hebat, capek tidak? Tapi senang kan? Sawit ini rezeki dari Allah untuk keluarga kita di Inhu. Kita harus syukur dan jaga kebun.' Beri bintang 'Petani Cilik Hebat Inhu'. Doa pulang: 'Ya Allah berkahi kebun sawit kami'. Pesan: jangan bakar kebun. (Mindful & Joyful).",bahan:["Bola merah-hitam (simulasi buah sawit)","Keranjang anyam kecil & besar","Cat hijau & kuas","Daun sawit asli","Foto kebun sawit Rengat Barat","Tandan sawit mini mainan","Foto truk CPO Inhu"],diferensiasi:"Anak yang kuat/usia 5 th: angkut keranjang besar berisi 10 bola, hitung 1-10, dan simulasi timbang dengan timbangan mainan. Anak perlu bantuan/usia 4 th: hitung 1-5 dengan pendampingan, angkut keranjang kecil, menempel daun dengan lem stick. Visual: kartu siklus sawit. Auditori: lagu panen sawit. Kinestetik: panen langsung.",asesmen:"Checklist observasi: (1) NABP: Menunjukkan syukur atas rezeki kebun, (2) Jati Diri: Menyebutkan ayah/keluarga kerja di kebun sawit Inhu, bangga sebagai anak petani, (3) STEAM Numerasi: Mampu menghitung 10 buah sawit, (4) Motorik kasar: Mampu mengangkut keranjang, (5) Seni: Cap tangan pelepah dengan rapi. Dokumentasi: foto panen + karya cap tangan. Catatan anekdot: 'Hari ini Nayla bercerita: Ayahku panen 20 tandan di Lirik!'"},lkpd:{judul:"LKPD - Aku Petani Sawit Cilik Inhu",usia:"4-5",tujuan:"Mengenal siklus sawit dari buah hingga minyak dan melatih motorik kasar panen serta numerasi 1-10 - Jati Diri & STEAM",amati:"Amati: Lihat tandan sawit mini ini. Warnanya merah-hitam, buahnya banyak menempel. Sentuh, bagaimana rasanya? Kasar dan berat. Cium aromanya, seperti minyak. Ini buah sawit asli dari kebun Seberida.",tiru:"Tiru: Guru mencontohkan memanen bola merah-hitam dari pohon tiruan, masukkan keranjang sambil hitung 1-10. Sekarang tiru gerakan guru: petik... masukkan... hitung! 1...2...3...",eksplorasi:"Eksplorasi: Coba panen sendiri! Ambil bola merah-hitam dari pohon, masukkan keranjang, hitung berapa? Coba 10 buah. Jika lebih, keluarkan. Jika kurang, tambah lagi. Gunakan biji karet sebagai penghitung.",kreasi:"Kreasi: Cap tanganmu dengan cat hijau jadi pelepah sawit. Tempel biji sawit di ujung jari. Tulis 'Kebunku 10 buah' dan hitung jumlah biji yang ditempel. Hiasi dengan daun sawit kering.",tugas:`1. Mewarnai truk pengangkut sawit warna kuning-hijau (motorik halus & warna)
2. Menghitung tandan sawit di atas truk: ada 10 tandan? Lingkari angka 10 (numerasi)
3. Menempel daun sawit asli pada gambar pelepah (kolase)
4. Menebalkan tulisan 'SAWIT' dengan krayon (literasi awal)`,observasi:["☐ Mengenal sawit sebagai sumber rezeki Inhu & penghasil CPO","☐ Motorik kasar: mampu memanen & mengangkut keranjang","☐ Numerasi: menghitung 10 buah sawit (1-10)","☐ Menunjukkan syukur & bangga jadi anak petani sawit Inhu"],refleksi:"Lingkari emoji: \uD83D\uDE0A Senang jadi petani / \uD83E\uDD29 Bangga panen banyak / \uD83D\uDE2E Capek tapi hebat - Ceritakan: Tadi panen berapa buah? Contoh: \uD83D\uDE0A Senang! Tadi aku panen 10 buah seperti ayah di Lirik!",catatan:"Sawit adalah komoditas utama Inhu, terutama di Lirik, Seberida, Rengat Barat, Pasir Penyu. Satu tandan bisa 15-25 kg. Buah merah saat matang, hitam saat mentah. Diolah jadi CPO di pabrik. Ajarkan anak bersyukur atas rezeki kebun dan menjaga lingkungan, tidak membakar.",ilustrasiPrompt:"Ilustrasi anak PAUD Melayu baju petani topi caping kuning, memanen bola sawit merah-hitam dari pohon sawit mini, keranjang anyam, truk pengangkut sawit kuning, background kebun sawit luas Rengat Barat Indragiri Hulu, gaya flat ceria warna hijau sawit #2E7D32 dan kuning songket #FFC107, ada tandan sawit dan daun berduri"}},{id:"sungai",title:"Sungai Indragiri Sahabatku",emoji:"\uD83D\uDEF6",short:"Nadi Inhu",usia:"5-6",badge:"BARU • 5-6 Th",desc:"Nadi Inhu dari hulu ke Rengat, eksperimen air jernih vs keruh, perahu pelepah pisang, peduli ikan patin.",color:"from-[#E3F2FD] to-[#BBDEFB]",borderActive:"border-[#1565C0]",rppm:{temaBesar:"Sungai Indragiri Sahabatku",topikMingguan:"Sungai Indragiri Sahabatku",minggu:"Minggu ke-3 Januari 2027",tujuan:"Anak mengenal Sungai Indragiri sebagai nadi kehidupan Inhu (transportasi, ikan patin, mandi), menunjukkan kepedulian lingkungan dengan tidak membuang sampah, melakukan eksperimen sains sederhana air jernih vs keruh, serta membuat kreasi perahu (NABP, Jati Diri, STEAM Sains)"},rpph:{hari:"Rabu",tanggal:"2027-01-20",tema:"Sungai Indragiri Sahabatku",subtema:"Sungai Indragiri Sahabatku - Nadi Inhu",tujuan:"Mengenal Sungai Indragiri sebagai nadi Inhu, peduli lingkungan, eksperimen air - Anak mampu membedakan air jernih vs keruh dan membuat perahu sederhana",mindAction:"Mindful (5'): Tarik napas, dengarkan audio gemericik air Sungai Indragiri. Guru: 'Dengarkan... suara air mengalir dari hulu sampai Rengat... pejamkan mata... bayangkan kamu di atas sampan...' Gerakan sampan Rentak Bulian perlahan untuk regulasi emosi.",meaningAction:"Meaningful (15'): Cerita sungai untuk mandi, tempat hidup ikan patin khas Inhu yang enak di gulai, transportasi pompong dari Seberida ke Rengat, sumber air kebun. Cerita sedih: jika buang sampah, ikan patin sedih dan air keruh. Harus jaga, seperti Datuk Talang Mamak jaga hutan larangan.",joyfulAction:"Joyful (20'): Eksperimen air jernih vs keruh dengan saringan pasir & kain, main perahu kertas di baskom air lomba sampan, kreasi perahu dari pelepah pisang/botol bekas. Lagu: 'Sampan... sampan... menyusuri Sungai Indragiri...'. Anak pilih mau perahu kertas atau pelepah.",pembukaan:"Anak-anak, Sungai Indragiri itu panjang sekali, dari hulu di Pegunungan sampai muara di Rengat, tempat sampan lewat! Itu nadi kita, seperti urat di tangan. Kita dengar suara air... (putar audio 1 menit) + gerakan sampan Rentak Bulian: dayung kanan... dayung kiri... Siapa pernah naik pompong di Rengat? Wah hebat!",inti:`1. Amati (10'): Guru tunjukkan video/foto Sungai Indragiri Rengat, kapal pompong, jembatan, ikan patin Inhu yang besar. Anak amati warna air coklat saat hujan, jernih saat kemarau. Guru: 'Lihat kapal ini, membawa sawit dari Lirik ke Rengat!'
2. Makna (15'): Cerita sungai untuk mandi, tempat ikan patin hidup, transportasi orang & sawit, sumber air kebun. Jelaskan pentingnya: kalau sungai kotor, ikan mati, perahu kandas. Harus jaga jangan buang sampah. Kaitkan dengan adat Talang Mamak yang jaga hutan larangan agar sungai tetap bersih.
3. Eksplorasi (15'): Eksperimen air jernih vs keruh. Siapkan 2 gelas: satu air keruh campuran tanah dari tepi sungai, satu air jernih. Saring dengan pasir, kain perca, daun. Anak amati perubahan. Main perahu kertas di baskom air, tiup agar bergerak, lomba sampan mini. Hitung berapa perahu bisa mengapung.
4. Kreasi (20'): Membuat perahu dari pelepah pisang/botol bekas, melukis sungai dengan cat air biru di kertas panjang, kolase ikan patin dari kertas perak. Anak memilih: mau perahu pelepah atau botol? Hiasi dengan bendera songket mini.`,penutup:"Refleksi janji: Anak melingkar, pegang perahu karya, ucapkan janji 'Aku jaga Sungai Indragiri, tidak buang sampah, sayang ikan patin!' + lagu sampan Rentak Bulian. Guru beri bintang 'Penjaga Sungai Hebat Inhu'. Pesan: besok bawa botol bekas untuk buat perahu lagi. (Mindful, Joyful, Meaningful).",bahan:["Baskom air besar","Perahu kertas warna-warni","Pelepah pisang & botol bekas","Saringan: pasir, kain perca, kapas","Foto Sungai Indragiri Rengat & kapal pompong","Foto ikan patin Inhu","Cat air biru & kuas","Kertas perak untuk ikan"],diferensiasi:"Anak yang cepat: buat 2 jenis perahu (kertas + pelepah), jelaskan perbedaan mengapung/tenggelam, tulis label 'Perahuku'. Anak perlu bantuan: melipat perahu dengan bantuan guru, mewarnai aliran sungai dengan kuas besar. Visual: video sungai. Auditori: suara air & lagu sampan. Kinestetik: main perahu di baskom, eksperimen saringan.",asesmen:"Checklist: (1) NABP: Mensyukuri nikmat air Sungai Indragiri, (2) Jati Diri: Menyebutkan fungsi sungai untuk masyarakat Inhu (transportasi, ikan patin), menunjukkan peduli lingkungan, (3) STEAM Sains: Mampu membedakan air jernih vs keruh dan menjelaskan proses penyaringan, (4) Seni: Membuat perahu dengan kreatif, (5) Bahasa: Janji menjaga sungai. Dokumentasi: foto eksperimen + perahu + video janji. Anekdot: 'Hari ini Galang bilang: Kalau buang sampah, ikan patin sedih lo Bu!'"},lkpd:{judul:"LKPD - Jagalah Sungai Indragiriku",usia:"5-6",tujuan:"Mengenal Sungai Indragiri sebagai nadi Inhu dan menumbuhkan kepedulian lingkungan melalui eksperimen air dan kreasi perahu",amati:"Amati: Lihat foto Sungai Indragiri di Rengat, panjang sekali, ada kapal pompong, airnya mengalir. Lihat ikan patin Inhu yang hidup di sungai, besar dan enak. Amati 2 gelas air: satu keruh coklat (kotor), satu jernih (bersih). Mana yang disukai ikan?",tiru:"Tiru: Guru mencontohkan menyaring air keruh dengan pasir dan kain: tuang perlahan... lihat air menetes jernih! Sekarang tiru: masukkan pasir, taruh kain, tuang air keruh. Perhatikan perubahan warna.",eksplorasi:"Eksplorasi: Coba saring sendiri dengan urutan berbeda! Coba mainkan perahu kertas di baskom air, tiup agar bergerak. Berapa perahu bisa mengapung? Hitung! Membedakan sampah: mana organik (daun) vs anorganik (plastik) yang tidak boleh dibuang ke sungai?",kreasi:"Kreasi: Buat perahu dari pelepah pisang atau botol bekas, hiasi bendera kuning. Lukis aliran Sungai Indragiri dari hulu ke hilir dengan cat biru, hubungkan titik-titik jadi garis sungai berkelok. Tempel ikan patin perak.",tugas:`1. Membedakan sampah organik (daun pisang, sisa buah) vs anorganik (plastik, botol) - lingkari yang tidak boleh dibuang ke sungai (peduli lingkungan)
2. Mewarnai perahu kertas dan pelepah pisang (seni)
3. Menghubungkan titik-titik menjadi aliran Sungai Indragiri dari hulu ke hilir Rengat (motorik halus & kognitif)
4. Menempel ikan patin pada sungai yang sudah dilukis (kreasi)`,observasi:["☐ Mengenal Sungai Indragiri sebagai nadi Inhu & habitat ikan patin","☐ Peduli lingkungan: tidak buang sampah di sungai, bedakan organik/anorganik","☐ Sains sederhana: eksperimen air jernih vs keruh dengan saringan","☐ Kreasi perahu dari bahan bekas & melukis aliran sungai"],refleksi:"Lingkari emoji: \uD83D\uDE0A Senang jaga sungai / \uD83D\uDE22 Sedih sungai kotor / \uD83E\uDD29 Bangga perahuku mengapung - Janji: Aku... Contoh: \uD83D\uDE0A Senang! Janji: Aku jaga Sungai Indragiri, tidak buang sampah, sayang ikan patin!",catatan:"Sungai Indragiri panjang ± 400km, dari Bukit Barisan sampai Selat Berhala, melewati Rengat sebagai ibukota Inhu. Dulu transportasi utama pompong membawa karet & sawit. Kini terancam sampah plastik & limbah. Ikan patin adalah ikon kuliner Inhu (gulai patin). Ajarkan anak adat Talang Mamak menjaga sungai sebagai hutan larangan.",ilustrasiPrompt:"Ilustrasi anak PAUD Melayu baju teluk belanga biru, membuat perahu dari pelepah pisang di baskom air, eksperimen saringan air keruh vs jernih, background Sungai Indragiri Rengat dengan kapal pompong dan jembatan, ikan patin besar, gaya flat ceria warna biru sungai #1565C0 dan hijau sawit #2E7D32, ada sampah organik vs anorganik"}},{id:"bolu",title:"Bolu Berendam - Kuliner Bangsawan Melayu Rengat",emoji:"\uD83C\uDF70",short:"Kuliner Melayu",usia:"5-6",badge:"BARU • 5-6 Th",desc:"Kuliner kebanggaan Rengat, dulu hanya untuk bangsawan. Bentuk kapal kecil berendam kuah gula merah manis, wangi pandan.",color:"from-[#FFF3E0] to-[#FFCC80]",borderActive:"border-[#EF6C00]",rppm:{temaBesar:"Kuliner Melayu Indragiri Hulu",topikMingguan:"Bolu Berendam Kuliner Bangsawan Melayu Rengat",minggu:"Minggu ke-2 Desember 2026",tujuan:"Anak mengenal kuliner khas Bolu Beghondam asal Rengat Indragiri Hulu yang dulu hanya untuk bangsawan kerajaan Indragiri, melatih motorik halus membentuk bolu, numerasi menghitung 6 buah bolu, sains menyerap kuah gula merah, serta menunjukkan rasa syukur dan bangga budaya Melayu Rengat (NABP, Jati Diri, STEAM)"},rpph:{hari:"Kamis",tanggal:"2026-12-10",tema:"Kuliner Melayu Indragiri Hulu",subtema:"Bolu Berendam Kuliner Bangsawan Melayu Rengat",tujuan:"Mengenal kuliner khas Bolu Beghondam asal Rengat Indragiri Hulu yang dulu hanya untuk bangsawan, melatih motorik halus, matematika, dan rasa syukur (Mindful, Meaningful, Joyful sesuai Permendikdasmen 13/2025) - Anak mampu menghitung 6 bolu, menceritakan rasa & asal, serta membuat kreasi plastisin",mindAction:"Mindful (5'): Tarik napas, dengarkan Dundung Melayu, cium aroma pandan & gula merah. Guru: 'Assalamualaikum anak-anak hebat Melayu Inhu! Hari ini Ibu bawa kue yang sangat istimewa dari Rengat. Namanya Bolu Berendam atau orang Rengat bilang Bolu Beghondam. Dulu, zaman kerajaan Indragiri, kue ini hanya boleh dimakan Raja dan keluarga bangsawan lho! Coba cium aromanya... harum pandan dan manis... Pejamkan mata, bayangkan istana Rengat...'",meaningAction:"Meaningful (15'): Cerita sejarah Bolu Berendam dari Rengat, Kabupaten Indragiri Hulu, dibuat dengan penuh cinta, bentuknya unik seperti kapal kecil yang berendam kuah manis gula merah melambangkan manisnya adat Melayu. Dulu hidangan istana Raja Indragiri. Kaitkan dengan budaya Melayu Riau & tradisi berbagi kue saat kenduri. Tanya: 'Siapa pernah makan Bolu Berendam di rumah nenek?'",joyfulAction:"Joyful (20'): Kreasi Bolu Berendam mainan dari plastisin warna coklat gula merah & hijau pandan, menghias dengan taburan meses sebagai gula merah. Cooking class mini: menata bolu asli ke piring dan menyiram kuah. Anak yang alergi membuat dari kertas origami kapal kecil. Lagu: 'Bolu Berendam... manis manis... dari Rengat untuk kita...'. Anak memilih mau plastisin atau origami.",pembukaan:"Assalamualaikum anak-anak hebat Melayu Inhu! Hari ini Ibu bawa kue yang sangat istimewa dari Rengat. Namanya Bolu Berendam atau orang Rengat bilang Bolu Beghondam. Dulu, zaman kerajaan Indragiri, kue ini hanya boleh dimakan Raja dan keluarga bangsawan lho! Coba cium aromanya... harum pandan dan manis... (Mindful - syukur). Kegiatan: Doa bersama mensyukuri rezeki kuliner Inhu, absen dengan nyanyian Dundung Melayu 'Dundung... dundung...', apersepsi kue bangsawan: 'Siapa pernah makan Bolu Berendam di rumah nenek? Warnanya apa? Rasanya manis seperti senyum Melayu!'",inti:`1. Amati (10'): Guru tunjukkan Bolu Berendam asli (atau foto besar), amati bentuk unik seperti kapal kecil/perahu yang berendam kuah manis gula merah coklat keemasan. Anak sentuh tekstur lembut spons bolu, cium aroma pandan & gula merah, amati warna coklat gula merah & hijau pandan. Guru: 'Lihat, seperti kapal kecil berendam ya? Lembut sekali!'
2. Makna (15'): Cerita sejarah - Bolu Berendam dari Rengat, Kabupaten Indragiri Hulu, dibuat dengan penuh cinta oleh nenek moyang, bentuknya unik dan rasa manis melambangkan manisnya adat Melayu, gotong royong, dan keramahan. Dulu hidangan istana Raja Indragiri di Rengat, hanya disajikan untuk tamu bangsawan. Kaitkan dengan budaya Melayu Riau: berbagi makanan saat kenduri, syukur atas rezeki. Tampilkan foto Istana Rengat / Raja Indragiri.
3. Eksplorasi Sains & Matematika (15'): Mencium dan menebak bahan: tepung, telur, gula merah, santan, daun pandan - tebak aroma! Menghitung 6 buah bolu di piring (matematika 1-6) - 'Ada berapa bolu di piring Ibu? 1,2,3...6!'. Eksperimen 'berendam' - lihat bolu menyerap kuah gula merah (sains menyerap/pori-pori): tuang kuah mainan (air + pewarna coklat), amati bolu mengembang & menyerap, catat perubahan warna.
4. Kreasi (20' - Joyful): Membuat Bolu Berendam mainan dari plastisin / playdough warna coklat gula merah dan hijau pandan. Cara: bulatkan plastisin coklat jadi bolu, pipihkan sedikit, buat cekungan seperti kapal, isi dengan plastisin hijau muda sebagai kuah? Atau menghias dengan taburan meses warna-warni sebagai gula merah. Alternatif cooking class sederhana: jika ada bolu asli, anak menata bolu ke piring plastik dan menyiram kuah gula merah dengan sendok (motorik halus). Anak yang alergi bisa membuat dari kertas origami bentuk kapal kecil warna coklat. Beri nama 'Bolu Berendam Buatanku - Rengat 2026'.`,penutup:"Alhamdulillah, hari ini kita jadi koki cilik Melayu! Siapa yang mau cerita rasanya Bolu Berendam? Manis ya? Seperti manisnya senyum kalian. Kita harus bangga punya kuliner hebat dari Rengat! Janji jaga resep nenek moyang ya? (Transkrip guru: Alhamdulillah, hari ini kita jadi koki cilik Melayu! Siapa yang mau cerita rasanya Bolu Berendam? Manis ya? Seperti manisnya senyum kalian. Kita harus bangga punya kuliner hebat dari Rengat! Janji jaga resep nenek moyang ya?) Kegiatan: Lingkaran refleksi: anak duduk melingkar pegang karya plastisin, ceritakan rasanya, cuci tangan bersama dengan lagu, berdoa sesudah makan: 'Allahumma bariklana...', pemberian reward bintang 'Koki Melayu Cilik Inhu' warna coklat-emas, pesan moral: berbagi makanan dengan teman seperti adat Melayu - 'Kalau punya 6 bolu, bagi 3 untuk teman ya, seperti Raja yang dermawan'.",bahan:["Bolu Berendam asli Rengat (atau foto besar)","Plastisin / playdough warna coklat gula merah & hijau pandan","Piring plastik kecil","Kuah gula merah mainan (air + pewarna coklat)","Daun pandan asli untuk aroma","Foto Istana Rengat / Raja Indragiri","Celemek koki cilik warna kuning","Meses warna-warni sebagai taburan gula","Tisu & sabun cuci tangan"],diferensiasi:"Anak mahir (5-6 th): membuat 2 bolu dengan variasi bentuk kapal besar-kecil, menulis label 'Bolu Berendam 6 buah', dan menceritakan sejarah singkat. Anak perlu dukungan: guru bantu membentuk bulatan plastisin, fokus menempel hiasan meses dengan pinset, menghitung 1-3 saja. Anak dengan kebutuhan khusus / alergi: aktivitas sensori meremas plastisin lembut warna coklat, mencium daun pandan, membuat kapal origami sederhana dengan bantuan. Visual: kartu langkah membuat bolu. Auditori: cerita sejarah kerajaan Indragiri. Kinestetik: meremas plastisin & menyiram kuah.",asesmen:"Checklist autentik: (1) NABP: Mensyukuri nikmat kuliner Bolu Berendam asal Rengat, berdoa sebelum & sesudah makan, (2) Jati Diri: Mengenal Bolu Berendam sebagai kuliner bangsawan Melayu Rengat, bangga sebagai anak Melayu Inhu, mau berbagi seperti adat Melayu, (3) STEAM Numerasi: Mampu menghitung 6 buah bolu (1-6), (4) STEAM Sains: Memahami konsep menyerap - bolu menyerap kuah gula merah, menyebutkan bahan (tepung, telur, gula merah, santan, pandan), (5) Motorik halus: Membentuk plastisin bulat & cekungan kapal dengan rapi, (6) Bahasa: Menceritakan rasa manis & asal dari Rengat. Dokumentasi: foto karya plastisin + foto saat menyiram kuah + catatan anekdot: 'Dessy sangat antusias mencium daun pandan dan berkata wangi seperti di dapur nenek'. Catatan: Simpan foto untuk portofolio Festival Kuliner Melayu Inhu."},lkpd:{judul:"LKPD Deep Learning - Aku Koki Bolu Berendam Melayu Rengat",usia:"5-6",tujuan:"Mengenal kuliner kebanggaan Rengat Bolu Beghondam, melatih motorik halus membentuk, numerasi menghitung 6 bolu, sains menyerap kuah gula merah, serta rasa syukur & bangga budaya Melayu - Jati Diri & STEAM",amati:"Amati: Lihat gambar Bolu Berendam - Seperti apa bentuknya? Seperti kapal kecil / perahu kecil yang berendam di kuah manis gula merah coklat! Warnanya coklat keemasan, hijau pandan, kuahnya kental manis. Cium aroma daun pandan, harum! Sentuh tekstur lembut spons bolu, seperti awan.",tiru:"Tiru: Jiplak pola mangkok bolu dengan krayon coklat gula merah. Guru mencontohkan membuat bulatan bolu dari plastisin coklat, lalu buat cekungan seperti kapal. Sekarang tiru: bulatkan... tekan tengah... jadi kapal kecil! Ikuti garis putus-putus mangkok bolu di LKPD.",eksplorasi:"Eksplorasi: Tempel kapas / plastisin coklat sebagai bolu di atas piring gambar, lalu siram dengan cat air coklat sebagai kuah gula merah menggunakan teknik ciprat / kuas. Lihat kapas menyerap air coklat! Coba hitung berapa bolu yang kamu tempel? 6 buah? Hitung dengan biji karet.",kreasi:"Kreasi: Warnai dan tulis 'Bolu Berendam Buatanku - Rengat 2026' dengan krayon coklat & hijau pandan. Hiasi dengan kolase taburan gula merah dari kertas warna coklat yang digunting kecil-kecil. Tempel di kertas, beri nama, pamerkan di dinding kelas Pojok Kuliner Melayu Rengat.",tugas:`1. Menghitung: Ada berapa Bolu Berendam di piring? (gambar 6 bolu di piring) - Lingkari angka 6, tulis 6 (numerasi)
2. Motorik halus: Garis putus-putus menyiram kuah gula merah dari teko ke bolu - tarik garis melengkung seperti kuah mengalir (motorik)
3. Bahasa: Lengkapilah kalimat 'Bolu Berendam rasanya ... (manis) dan berasal dari ... (Rengat / Indragiri Hulu)' - tulis kata manis & Rengat
4. Seni & Sains: Kolase taburan gula merah dari kertas warna coklat & teknik ciprat cat air coklat sebagai kuah yang merendam (kreasi & sains menyerap)`,observasi:["☐ Mengenal kuliner khas Inhu Bolu Berendam / Beghondam dari Rengat","☐ Motorik halus: membentuk bolu dari plastisin & menempel kolase gula merah","☐ Numerasi: menghitung 6 Bolu Berendam (1-6)","☐ Bahasa: menceritakan rasa manis & asal dari Rengat","☐ Sikap syukur & bangga budaya Melayu, mau berbagi seperti adat bangsawan"],refleksi:"Lingkari emoji: \uD83D\uDE0B Enak sekali - manis seperti gula merah Rengat! / \uD83D\uDE42 Enak - suka wangi pandan / \uD83D\uDE10 Belum coba - mau coba nanti - Lalu tulis: 'Aku paling suka bagian... (menyiram kuah / membentuk bolu / mencium pandan) karena...'. Contoh: \uD83D\uDE0B Enak sekali! Aku paling suka bagian menyiram kuah gula merah karena seperti kapal berendam!",catatan:"Bolu Berendam / Beghondam adalah kuliner kebanggaan Rengat, Indragiri Hulu, Riau. Konon hanya disajikan untuk bangsawan kerajaan Indragiri di Istana Rengat. Bentuk unik seperti kapal kecil yang berendam kuah gula merah kental manis menjadi ciri khas. Terbuat dari tepung, telur, gula merah, santan, dan pandan. Mengajarkan anak mencintai kuliner lokal adalah bagian dari penguatan Jati Diri dan Profil Pelajar Pancasila sesuai Permendikdasmen 13/2025 & 1/2026. Simpan resep dari nenek.",ilustrasiPrompt:"Ilustrasi anak PAUD Melayu baju koki celemek kuning, membuat Bolu Berendam dari plastisin coklat & hijau pandan, di piring ada 6 bolu kapal kecil berendam kuah gula merah coklat keemasan, daun pandan asli, foto Istana Rengat background, gaya flat ceria warna oranye gula merah #EF6C00 & coklat #8D6E63 dan hijau pandan #66BB6A, ada teko kuah gula merah"}}],N1={identitas:{subtitle:"Memahami identitas lembaga sebagai akar perencanaan kontekstual",apa:"Identitas Lembaga adalah fondasi administratif dan filosofis perencanaan. Menurut Permendikdasmen No.13 Tahun 2025 Pasal 8 ayat 2, setiap satuan PAUD wajib mencantumkan karakteristik daerah sebagai bagian dari kurikulum operasional. Ini mencakup nama lembaga, NPSN, alamat, kecamatan di Inhu, dan ciri khas (misal: Berbasis Sungai, Sawit, Songket). Tanpa identitas yang jelas, CP-TP-ATP akan kehilangan konteks.",mengapa:"Dalam paradigma Deep Learning (Permendikdasmen 1/2026), prinsip MEANINGFUL bermakna pembelajaran harus terhubung dengan kehidupan nyata anak. Jika guru memilih 'Kec. Lirik = Berbasis Kebun Sawit', maka seluruh pembelajaran numerasi bisa pakai biji karet. Ini adalah Mindful: guru sadar akan lingkungan anak. Joyful: anak senang karena belajar dari kebunnya sendiri, bukan dari contoh kota besar yang asing.",bagaimana:"Cara mengisi: (1) Pilih kecamatan sesuai Dapodik. Contoh: Rengat Barat dekat Sungai Indragiri -> pilih Berbasis Alam Sungai Indragiri. (2) Ciri khas pilih minimal 2. Contoh: Guru di Seberida: 'Kami pilih Berbasis Budaya Melayu + Berbasis Alam Sungai'. (3) Kelompok usia sesuaikan: 5-6 tahun fokus pada proyek. Contoh kontekstual: Alamat lengkap tuliskan 'Jl. Lintas Timur No.45, Pematang Reba' agar saat verifikasi Dinas Inhu mudah.",narasi:[{judul:"Saat orientasi orang tua",guru:"'Assalamualaikum, Ibu Bapak hebat Indragiri Hulu. Sekolah kita ini TK Pembina Rengat, terletak di tepi Sungai Indragiri. Karena itu, kita pakai ciri khas Berbasis Sungai dan Songket, supaya anak bangga jadi anak Inhu.'",konteks:"Guru menjelaskan ke orang tua di awal semester"},{judul:"Saat menjelaskan ke anak",guru:"'Anak-anak, siapa rumahnya di Desa Pematang Reba? Wah, kita tetangga Sungai Indragiri ya. Sungai ini sahabat kita.'",anak:"Anak: 'Iya Bu, ayahku nelayan di Seberida!'",konteks:"Awal tahun, membangun identitas"}],tips:["Jika di Rengat Barat & Seberida: Fokus Sungai Indragiri - ajak anak melihat perahu, jembatan.","Jika di Lirik, Pasir Penyu, Rakit Kulim: Fokus Sawit/Karet - hitung janjang, tempurung.","Jika di Rengat Kota: Fokus Songket & Pasar Tradisional - kunjungi penenun motif Tampuk Manggis.","Motif Tampuk Manggis berasal dari buah manggis yang banyak di kebun Inhu, ceritakan ini agar anak paham simbol alam."],kaitan:"Permendikdasmen 13/2025 Pasal 8 (Karakteristik Satuan Pendidikan), Pasal 12 (Capaian Pembelajaran berbasis konteks lokal). Permendikdasmen 1/2026 Pasal 4 (Prinsip Pembelajaran Mendalam harus relevan)."},cp:{subtitle:"Membedah CP, TP, ATP agar tidak copy-paste tapi hidup",apa:"CP (Capaian Pembelajaran) adalah kompetensi minimal yang harus dicapai anak di akhir Fase Fondasi (Permendikdasmen 13/2025). Ada 3 elemen: (1) Nilai Agama & Budi Pekerti (NABP), (2) Jati Diri, (3) Literasi STEAM. TP (Tujuan Pembelajaran) adalah turunan CP yang lebih operasional harian. ATP (Alur Tujuan) adalah urutan TP selama 1 semester dari yang sederhana ke kompleks. Salah jika CP langsung jadi kegiatan harian tanpa dipecah jadi TP.",mengapa:"Deep Learning menuntut guru tidak hanya mengejar hafalan, tapi kesadaran (Mindful) - anak tahu MENGAPA berdoa sebelum makan sawit, kebermaknaan (Meaningful) - menghitung biji karet 1-20 itu nyata untuk petani Lirik, dan kegembiraan (Joyful) - tidak dipaksa menulis, tapi menulis kata 'SAWIT' dari biji.",bagaimana:"Contoh: Elemen JATI DIRI untuk usia 5-6. CP: 'Anak bangga sebagai anak Melayu Inhu'. TP: (1) Menyebutkan nama kecamatan asalnya, (2) Menyebutkan 2 motif songket Inhu (Tampuk Manggis & Rentak Bulian), (3) Menunjukkan perilaku gotong royong ala Talang Mamak. ATP Minggu 1-2: Aku & Keluargaku di Inhu. Minggu 3-4: Budaya Melayu & Talang Mamak. Minggu 5-8: Aku Bangga Jadi Anak Inhu - buat karya songket.",narasi:[{judul:"Transkripsi TP NABP",guru:"'Anak-anak, sebelum kita makan Bolu Berendam ini, kita baca doa dulu ya. Seperti nenek kita di Rengat yang selalu bersyukur atas rezeki Sungai Indragiri. Tiru Ibu ya: Bismillah...'",anak:"Anak menirukan doa dengan khidmat",konteks:"Pembiasaan NABP"},{judul:"Transkripsi STEAM - Numerasi Sawit",guru:"'Coba hitung, berapa biji karet di keranjang Bu Guru? 1,2,3... Ini seperti menghitung janjang sawit Ayah di kebun Lirik. Kalau Ayah panen 10 janjang, berapa uangnya ya?'",anak:"Anak: 'Banyak Bu! Bisa beli songket!'",konteks:"Mengaitkan matematika dengan kehidupan"},{judul:"Transkripsi Jati Diri - Songket",guru:"'Lihat kain Bu Guru, motif apa ini? Ini Tampuk Manggis, seperti mahkota manggis dari kebun kita. Orang Melayu Inhu pakai ini untuk acara adat. Siapa mau mencoba membuat motifnya?'",konteks:"Penguatan identitas"}],tips:["Jangan buat TP terlalu banyak (maks 3-4 per elemen). Fokus kedalaman, bukan keluasan - ini Deep Learning!","Saat mengajarkan NABP, gunakan Nandung/Dundung Melayu sebagai transisi mindful breathing.","Untuk STEAM: Gunakan tempurung kelapa sebagai alat musik hitung, pasir Sungai Indragiri sebagai media sains penyaringan.","Tulis TP dengan kata kerja operasional: mengenal, menunjukkan, membiasakan, menceritakan - bukan 'memahami' yang abstrak."],kaitan:"Permendikdasmen 13/2025 Lampiran I (Fase Fondasi, Elemen NABP-Jati Diri-STEAM), Pasal 10 (Penyusunan TP-ATP oleh satuan pendidikan). Permendikdasmen 1/2026 Pasal 5 ayat 2 (Pembelajaran mendalam wajib memuat tujuan yang bermakna)."},rppm:{subtitle:"Menyusun RPPM mingguan yang kontekstual, bukan tematik generik",apa:"RPPM (Rencana Pelaksanaan Pembelajaran Mingguan) adalah jembatan antara ATP semester dan RPPH harian (Permendikdasmen 1/2026 Pasal 9). RPPM memuat Tema Besar kontekstual Inhu (misal: Sungai Indragiri Sahabatku), Topik Mingguan (Air Bersih & Penjaga Sungai), Minggu pelaksanaan, dan Tujuan mingguan yang mengintegrasikan 3 elemen CP. Beda dengan tema generik 'Air, Api, Udara' yang tidak membumi.",mengapa:"Prinsip Meaningful: Anak di Seberida yang setiap hari lihat Sungai Indragiri akan lebih paham jika temanya Sungai, bukan 'Gedung Pencakar Langit'. Prinsip Mindful: Guru sadar akan isu lokal - sungai kotor karena sampah sawit. Prinsip Joyful: Anak diajak jadi 'Penjaga Sungai' dengan topi dari daun pisang, bukan hanya mewarnai gambar sungai.",bagaimana:"Cara mengisi: (1) Tema Besar pilih dari daftar khas Inhu. Misal: 'Panen Sawit' jika bulan panen di Lirik. (2) Topik mingguan lebih spesifik: Dari 'Panen Sawit' -> 'Menghitung Janjang & Membuat Minyak dari Sawit Tiruan'. (3) Tujuan mingguan: 'Anak mampu menghitung 1-20 dengan biji karet, mengenal tekstur daun sawit, dan menunjukkan sikap syukur atas rezeki kebun'. Contoh kontekstual: RPPM bulan November di Rengat: Tema 'Warisan Songketku' karena mau ada Festival Songket Inhu.",narasi:[{judul:"Narasi pembukaan minggu",guru:"'Minggu ini kita jadi Penjaga Sungai Indragiri! Seperti Datuk-datuk kita di Talang Mamak yang menjaga hutan, kita jaga sungai. Siapa yang siap?'",anak:"Anak: 'Siap Bu! Pakai topi daun!'",konteks:"Memulai minggu dengan semangat"},{judul:"Narasi menjelaskan tujuan mingguan ke anak",guru:"'Minggu ini kita akan belajar 3 hal: menghitung biji sawit seperti petani, menyaring air sungai seperti nelayan Seberida, dan membuat kolase songket seperti penenun di Pasar Rengat.'",konteks:"Transparansi tujuan (Meaningful)"}],tips:["Sinkronkan RPPM dengan musim Inhu: Musim panen sawit (buat tema Panen Sawit), Musim hujan sungai meluap (tema Sungai Indragiri Sahabatku).","Libatkan narasumber lokal: Petani sawit dari Lirik, penenun songket Rengat, tetua Talang Mamak.","Tujuan mingguan harus memuat 3 ranah: NABP (syukur), Jati Diri (bangga Inhu), STEAM (sains/numerasi).","Untuk Adat Talang Mamak: ceritakan rumah tinggi, kearifan menjaga hutan larangan.","TEMA BARU Panen Sawit: Minggu ke-1 Desember 2026 - gunakan bola merah-hitam sebagai simulasi tandan, hitung 10 buah, hubungkan dengan CPO & rezeki keluarga.","TEMA BARU Sungai Indragiri: Minggu ke-3 Januari 2027 - fokus eksperimen air jernih vs keruh, perahu pelepah pisang, ikan patin sebagai ikon, janji jaga sungai."],kaitan:"Permendikdasmen 1/2026 Pasal 9 (Perencanaan Mingguan), Pasal 11 (Tema harus relevan dengan karakteristik daerah). Permendikdasmen 13/2025 Pasal 13 (Fleksibilitas satuan pendidikan dalam menentukan tema)."},rpph:{subtitle:"Modul Ajar harian Deep Learning yang hidup - bukan administrasi mati",apa:"RPPH/Modul Ajar PAUD Deep Learning adalah skenario harian yang WAJIB memuat 3 prinsip Pembelajaran Mendalam (Permendikdasmen 1/2026 Pasal 4): Mindful (berkesadaran - regulasi emosi, Nandung, breathing), Meaningful (bermakna - koneksi kehidupan nyata Inhu), Joyful (menggembirakan - pilihan anak, bermain). Struktur baku: Pembukaan 15 menit (termasuk Nandung/Dundung Melayu), Inti 60 menit (eksplorasi kontekstual), Penutup 15 menit (refleksi). Dilengkapi Bahan Alam Inhu, Diferensiasi, dan Asesmen Autentik.",mengapa:"Tanpa RPPH yang jelas, guru akan terjebak 'asal bermain'. Deep Learning menuntut guru menjadi fasilitator yang sadar. Contoh: Mindful bukan sekadar doa, tapi 30 detik menutup mata mendengarkan gemericik Sungai Indragiri (audio). Meaningful bukan sekadar cerita sawit, tapi mengundang anak petani sawit menceritakan ayahnya. Joyful bukan sekadar bebas bermain, tapi anak memilih: mau kolase daun sawit atau mewarnai motif Tampuk Manggis?",bagaimana:"Cara mengisi lengkap: (1) Hari/Tanggal: Isi sesuai kalender. (2) Tema/Subtema: Ambil dari RPPM. Contoh: Tema Sungai Indragiri Sahabatku, Subtema Air Bersih dari Hulu ke Hilir. (3) Tujuan: Tulis 1 kalimat operasional: 'Anak mengenal pentingnya air bersih, praktik menyaring air sederhana, dan mensyukuri nikmat air Sungai Indragiri'. (4) Klik Generate Otomatis untuk dapatkan draft pembukaan-inti-penutup berbasis template Inhu. (5) Edit bahan: Tambahkan daun sawit kering, biji karet. (6) Diferensiasi: Visual (kartu siklus air), Auditori (Nandung), Kinestetik (praktik saring). (7) Asesmen: Observasi ceklis, bukan tes tulis!",narasi:[{judul:"NARASI PEMBUKAAN - Mindful Nandung",guru:"'Anak-anak hebat Indragiri Hulu, pagi ini Ibu akan menyanyikan Nandung seperti nenek kita di Rengat dulu. Mari duduk melingkar, tarik napas... Hmmm... dengarkan suara sungai... Sekarang siapa yang tadi pagi lewat Jembatan Sungai Indragiri? Ceritakan!'",anak:"Anak: 'Aku Bu! Airnya coklat karena hujan!'",konteks:"Apersepsi kontekstual, breathing, Nandung"},{judul:"NARASI INTI - Eksplorasi Daun Sawit & Saringan",guru:"'Coba sentuh daun sawit ini, apa rasanya? Tajam ya? Ini adalah berkah alam Inhu, dari daun ini ayah kalian buat sapu lidi. Sekarang kita jadi ilmuwan kecil Seberida. Lihat air keruh ini, dari Sungai Indragiri. Bagaimana caranya jadi jernih? Kita coba saring pakai pasir dan kain songket perca ini ya. Tuang pelan-pelan... Wah! Lihat perubahan warnanya!'",anak:"Anak: 'Wah jadi jernih Bu! Seperti air minum!'",konteks:"Meaningful - sains penyaringan"},{judul:"NARASI INTI - Songket Motif Tampuk Manggis",guru:"'Lihat kain songket Bu Guru, motifnya seperti buah apa? Ya, Tampuk Manggis! Tumbuhan manggis banyak di kebun Inhu. Dulu, motif ini hanya dipakai Raja Melayu. Sekarang kita semua bisa buat. Coba jiplak polanya, lalu warnai dengan kunyit. Kunyit ini pewarna alami dari kebun kita.'",anak:"Anak menjiplak dengan antusias",konteks:"Jati Diri + STEAM Seni"},{judul:"NARASI PENUTUP - Refleksi",guru:"'Siapa yang mau cerita apa yang dipelajari hari ini? Iya, Airul? Wah, Airul belajar bahwa Sungai Indragiri harus bersih. Tepuk hebat untuk Airul! Sekarang lingkari emoji perasaanmu: Senang? Bangga jadi penjaga sungai? Besok kita akan ke Pasar Tradisional Rengat melihat penenun songket, siapa mau ikut?'",anak:"Anak melingkar, menunjukkan emoji \uD83D\uDE0A\uD83E\uDD29",konteks:"Refleksi & rencana besok - Joyful"},{judul:"NARASI DIFFERENSIASI",guru:"'Untuk teman yang belum bisa gunting, Ibu bantu ya. Untuk yang sudah bisa, coba gunting motif Tampuk Manggis yang kecil ini. Semua hebat dengan caranya masing-masing.'",konteks:"Inklusi"},{judul:"NARASI BARU - Panen Sawit Selasa",guru:"'Anak-anak, siapa ayahnya kerja di kebun sawit? Sawit itu pohon tinggi banyak di Seberida dan Lirik, buahnya merah-hitam jadi tandan. Hari ini kita jadi petani cilik! Ayo petik bola merah ini, masukkan keranjang, hitung 10 buah! 1,2,3... Wah capek ya jadi petani, tapi senang karena ini rezeki keluarga kita.'",anak:"Anak: 'Aku dapat 10 Bu! Mau jual seperti ayah!'",konteks:"TEMA BARU Panen Sawit - motorik kasar & syukur"},{judul:"NARASI BARU - Sungai Indragiri Rabu",guru:"'Anak-anak, Sungai Indragiri itu panjang sekali, dari hulu sampai Rengat tempat sampan lewat! Dengar suara air... (audio). Sungai ini untuk mandi, ikan patin tinggal di sini. Kalau buang sampah, ikannya sedih lo! Sekarang kita saring air keruh jadi jernih, dan buat perahu pelepah pisang. Siapa mau janji jaga sungai?'",anak:"Anak: 'Aku janji Bu! Tidak buang sampah!'",konteks:"TEMA BARU Sungai Indragiri - peduli lingkungan"}],tips:["Pembukaan WAJIB ada Nandung/Dundung Melayu 2-3 menit - ini ciri khas Inhu dan bagian dari Mindful (Permendikdasmen 1/2026).","Saat mengajarkan songket, ceritakan: Motif Tampuk Manggis = mahkota buah manggis dari kebun Inhu, simbol kesuburan. Motif Rentak Bulian = irama musik pengiring tari Melayu.","Bahan: Jangan pakai bahan plastik impor. Pakai daun sawit kering, biji karet asli, tempurung, tanah liat Sungai Indragiri.","Asesmen: Jangan nilai dengan angka. Gunakan narasi: 'Anisa sudah mampu menyebutkan 2 manfaat Sungai Indragiri dan berpartisipasi menyaring air dengan sabar.' + foto karya.","Jika kelas di dekat kebun sawit (Lirik/Pasir Penyu), ajak anak ke kebun (field trip mini 15 menit) untuk meaningful.","TEMA BARU Panen Sawit (Selasa): Gunakan bola merah-hitam simulasi, keranjang anyam, cat hijau cap tangan pelepah. Diferensiasi: kuat angkut besar (5-6th), perlu bantuan hitung 1-5 (4-5th).","TEMA BARU Sungai Indragiri (Rabu): Eksperimen saringan pasir & kain, baskom perahu kertas, pelepah pisang/botol bekas. Cerita ikan patin sedih kalau sampah dibuang."],kaitan:"Permendikdasmen 1/2026 Pasal 4 (3 Prinsip Deep Learning), Pasal 5 (Struktur Modul Ajar: Pembukaan-Inti-Penutup), Pasal 7 (Bahan ajar berbasis lingkungan), Pasal 15 (Asesmen autentik PAUD). Permendikdasmen 13/2025 Pasal 14 (Pembelajaran berbasis bermain bermakna)."},lkpd:{subtitle:"LKPD Amati-Tiru-Eksplorasi-Kreasi yang bukan LKS mewarnai biasa",apa:"LKPD Deep Learning PAUD adalah lembar kerja yang memandu anak melalui 4 langkah paradigma baru (bukan lagi mengamati-menanya-mengumpulkan informasi): (1) AMATI - Mindful, anak mengamati dengan pancaindra benda nyata Inhu, (2) TIRU - Meaningful awal, anak meniru demonstrasi guru, (3) EKSPLORASI - Meaningful mendalam, anak mencoba variasi sendiri, (4) KREASI - Joyful, anak menghasilkan karya personal. LKPD ini BUKAN LKS yang harus diisi semua anak sama. LKPD memberi pilihan tugas kontekstual Inhu.",mengapa:"Mengapa LKPD harus Deep Learning? Karena Permendikdasmen 1/2026 menekankan anak sebagai pembelajar aktif, bukan pengisi lembar. Prinsip Mindful: Anak diajak mengamati air keruh Sungai Indragiri dengan rasa ingin tahu, bukan disuruh langsung mewarnai. Meaningful: Menyaring air dengan pasir & kain songket itu nyata, bukan abstrak. Joyful: Kreasi poster 'Aku Penjaga Sungai' dengan kolase daun sawit itu pilihan, bukan paksaan.",bagaimana:"Cara mengisi: (1) Judul: Contoh 'LKPD Penjaga Sungai Indragiri - Menyaring Air Keruh'. (2) Usia: 5-6. (3) Tujuan: 'Melalui kegiatan menyaring air, anak mampu berpikir kritis (STEAM), mengenal proses sains sederhana, dan menunjukkan kepedulian lingkungan khas Inhu'. (4) Langkah: Amati: 'Perhatikan air sungai keruh campuran tanah'. Tiru: 'Guru mendemonstrasikan menuang air ke botol saringan'. Eksplorasi: 'Anak mencoba urutan saringan berbeda'. Kreasi: 'Buat poster mini Aku Penjaga Sungai'. (5) Tugas kontekstual: Pilih 3-4 tugas: Mewarnai motif Rentak Bulian, Menghitung biji karet, Kolase daun sawit. (6) Observasi: Tulis indikator ceklis CP. (7) Refleksi: Emoji.",narasi:[{judul:"NARASI AMATI - Mindful",guru:"'Anak-anak, mari jadi detektif Sungai Indragiri. Tutup mata sebentar, dengarkan... Sekarang buka mata, lihat air di gelas ini. Warnanya apa? Coklat ya, seperti air Sungai Indragiri habis hujan. Cium, ada bau apa? Amati dengan mata, hidung, tangan.'",anak:"Anak: 'Bau tanah Bu!'",konteks:"Stimulasi pancaindra"},{judul:"NARASI TIRU - Demonstrasi",guru:"'Perhatikan Ibu ya. Ibu akan saring air keruh ini. Pertama, masukkan pasir halus, lalu kain perca songket motif Tampuk Manggis, lalu daun kering. Sekarang tuang pelan... Lihat! Air menetes jernih. Sekarang giliran kalian meniru.'",konteks:"Modeling"},{judul:"NARASI EKSPLORASI - Mencoba Variasi",guru:"'Pintar! Sekarang coba kalau urutannya dibalik, apa yang terjadi? Atau kalau pasirnya lebih banyak? Hitung berapa kali saring sampai jernih, pakai biji karet ini sebagai penghitung. 1 biji = 1 kali saring.'",anak:"Anak bereksperimen, menghitung",konteks:"Critical thinking"},{judul:"NARASI KREASI - Joyful Poster",guru:"'Wah, airnya sudah jernih! Sekarang kita buat poster Aku Penjaga Sungai. Tempel daun sawit kering membentuk aliran sungai, lalu cap tanganmu sebagai tanda janji menjaga Sungai Indragiri. Tulis pesan untuk warga Rengat: Jangan buang sampah di sungai!'",anak:"Anak membuat poster dengan bangga",konteks:"Kreasi & aksi nyata"},{judul:"NARASI REFLEKSI LKPD",guru:"'Sudah selesai? Sekarang lingkari perasaanmu hari ini. \uD83D\uDE0A Senang? \uD83E\uDD29 Bangga jadi penjaga sungai? Ceritakan ke teman di sebelahmu apa yang kamu pelajari.'",konteks:"Refleksi"},{judul:"NARASI BARU - Sawit: Menghitung di Truk",guru:"'Coba hitung berapa sawit di truk ini? 1,2,3...10! Pintar! Seperti petani di Lirik yang panen banyak. Sekarang warnai truknya kuning-hijau, tempel daun sawit.'",anak:"Anak: '10 Bu! Banyak!'",konteks:"TEMA BARU Panen Sawit LKPD"},{judul:"NARASI BARU - Sungai: Ikan Sedih",guru:"'Kalau buang sampah di sungai, ikannya sedih lo! Lihat ikan patin ini sedih karena plastik. Yuk bedakan sampah organik (daun) dan anorganik (plastik). Yang plastik jangan dibuang ke sungai ya!'",anak:"Anak: 'Kasihan ikannya Bu! Aku buang di tempat sampah!'",konteks:"TEMA BARU Sungai LKPD"}],tips:["LKPD jangan penuh tulisan. Gunakan gambar besar: ilustrasi anak Melayu baju teluk belanga kuning menyaring air.","Warna LKPD: Hijau daun sawit #2E7D32 + Kuning songket #FFC107 - ini identitas Inhu.","Tugas kontekstual: Untuk tema Songket, tugasnya 'Kolase benang kuning songket di kertas', 'Mewarnai motif Tampuk Manggis'.","Untuk tema Panen Sawit: 'Cap daun sawit dengan cat', 'Simulasi jual beli sawit di pasar mini pakai biji karet sebagai uang'.","Observasi guru: Fokus pada proses, bukan hasil akhir poster yang rapi. Catat: 'Mampu mengurutkan langkah saringan' lebih penting dari 'Poster bagus'.","Simpan LKPD sebagai portofolio, bukan untuk dinilai salah/benar.","TEMA BARU Sawit LKPD 'Aku Petani Sawit Cilik Inhu': Mewarnai truk pengangkut, hitung 10 tandan, tempel daun sawit, tebalkan kata SAWIT. Transkrip: 'Coba hitung berapa sawit di truk ini?'","TEMA BARU Sungai LKPD 'Jagalah Sungai Indragiriku': Bedakan sampah organik/anorganik (gambar), warnai perahu, hubungkan titik jadi aliran sungai, tempel ikan patin. Transkrip: 'Kalau buang sampah di sungai, ikannya sedih lo!'"],kaitan:"Permendikdasmen 1/2026 Pasal 5 ayat 4 (LKPD berbasis Deep Learning: Amati-Tiru-Eksplorasi-Kreasi), Pasal 7 (Media dari lingkungan), Pasal 15 (Asesmen). Permendikdasmen 13/2025 Pasal 15 (Karakteristik LKPD PAUD: bermain, bermakna)."},preview:{subtitle:"Finalisasi dokumen resmi siap cetak & asesmen",apa:"Preview & Cetak adalah tahap akhir validasi dokumen perencanaan sesuai Standar Administrasi PAUD (Permendikdasmen 1/2026 Pasal 18). Dokumen harus memuat Kop Resmi Pemkab Inhu, identitas lembaga, CP-TP-ATP, RPPM, RPPH/Modul Ajar, LKPD, serta watermark 'Pembelajaran Mendalam Berkearifan Lokal Indragiri Hulu'. Dokumen ini siap di-print A4, di-tandatangani Kepala Sekolah dan Guru, dan menjadi bukti fisik untuk supervisi Dinas Pendidikan Inhu.",mengapa:"Mengapa perlu preview? Karena Deep Learning bukan hanya di kelas, tapi juga akuntabilitas. Prinsip Mindful: Guru merefleksikan apakah dokumennya sudah sesuai prinsip? Meaningful: Apakah bahan alam Inhu sudah masuk? Joyful: Apakah asesmennya autentik (foto karya, bukan angka)? Dokumen yang baik memudahkan guru lain memahami alur berpikir guru.",bagaimana:"Cara menggunakan: (1) Cek semua tab sudah terisi: Identitas, CP-TP-ATP, RPPM, RPPH, LKPD. (2) Klik Preview & Cetak. (3) Lihat Kop: Pastikan nama lembaga dan kecamatan benar. (4) Cek watermark Pembelajaran Mendalam. (5) Klik Export Teks / Word untuk disimpan. (6) Cetak A4. Tanda tangan. Contoh kontekstual: Dokumen RPPH 'Sungai Indragiri Sahabatku' dengan bahan daun sawit akan terlihat profesional saat supervisi Pengawas PAUD Inhu karena relevan dengan lingkungan Seberida.",narasi:[{judul:"Narasi saat menjelaskan dokumen ke Kepala Sekolah",guru:"'Bu Kepala, ini RPPH minggu ini tentang Warisan Songketku. Saya sudah pakai prinsip Deep Learning: Mindful-nya Nandung Rentak Bulian, Meaningful-nya wawancara penenun di Pasar Rengat, Joyful-nya anak memilih motif Tampuk Manggis. Bahan dari kain perca songket dan pewarna kunyit. Asesmennya foto karya, bukan angka.'",konteks:"Akuntabilitas"},{judul:"Narasi saat supervisi Dinas",guru:"'Dokumen ini sesuai Permendikdasmen 13/2025 & 1/2026, Bapak Pengawas. Ciri khas kami Berbasis Sungai Indragiri, jadi semua tema terkait sungai, sawit, dan songket Inhu. Watermark Pembelajaran Mendalam Berkearifan Lokal sebagai komitmen.'",konteks:"Supervisi"}],tips:["Selalu Export Teks sebelum cetak untuk backup.","Saat cetak, gunakan kertas HVS 80gr, warna watermark akan terlihat samar (estetika resmi).","Jangan lupa tanda tangan Kepala Sekolah dan Guru + cap sekolah + tanggal di Rengat.","Untuk Festival PAUD Inhu, dokumen ini bisa dipamerkan sebagai best practice kontekstual.","Simpan file dengan nama: RPPM_Minggu2_November2025_SungaiIndragiri_TK_Pembina_Rengat.pdf"],kaitan:"Permendikdasmen 1/2026 Pasal 18 (Dokumentasi Pembelajaran), Pasal 19 (Pelaporan). Permendikdasmen 13/2025 Pasal 20 (Administrasi Kurikulum Operasional). Juknis BOS PAUD 2025 (Dokumen perencanaan sebagai syarat pencairan)."}};function Qt({id:e}){let[n,t]=te.useState ","Minggu 2: Eksplorasi motif tampuk manggis - asal usul dari buah manggis, bentuk mahkota, makna kesuburan alam Melayu","Minggu 3: Kreasi kolase - membuat motif tampuk manggis dengan media alam, pameran karya Warisan Inhu"]),[R,p]=te.useState({mindful:!0,meaningful:!0,joyful:!0}),[s,m]=te.useState({temaBesar:"Aku Cinta Indragiri Hulu",topikMingguan:"Motif Songket Tampuk Manggis - Warisan Indragiri Hulu",minggu:"Minggu ke-2 November 2026",tujuan:"Anak mengenal warisan budaya songket motif tampuk manggis sebagai identitas Melayu Indragiri Hulu, menunjukkan rasa bangga, mengenal asal usul dari buah manggis di kebun Inhu, dan mampu membuat kreasi kolase motif dengan gembira (Jati Diri + STEAM Seni)"}),[v,E]=te.useState({hari:"Senin",tanggal:"2026-11-18",tema:"Aku Cinta Indragiri Hulu",subtema:"Motif Songket Tampuk Manggis - Warisan Indragiri Hulu",tujuan:"Melalui kegiatan mengamati kain songket, anak mampu mengidentifikasi motif tampuk manggis (Mindful), menghubungkan motif dengan tumbuhan manggis di kebun Inhu (Meaningful), dan membuat kreasi kolase dengan gembira (Joyful)",mindAction:"Mindful (5'): Tarik napas, dengarkan Nandung Indragiri Hulu 'La ilaha illallah tidurlah anak...', fokus amati kilau benang emas songket. Guru: 'Diam sejenak, lihat betapa cantiknya kilau emas ini seperti matahari pagi di kebun manggis Inhu.'",meaningAction:"Meaningful (15'): Cerita asal motif tampuk manggis dari buah manggis yang melimpah di Inhu, bentuknya seperti mahkota melambangkan kesuburan alam Melayu. Hubungkan dengan pengalaman anak: 'Siapa pernah makan buah manggis ungu manis dari kebun? Di bawah buah ada mahkota, itulah Tampuk Manggis!'",joyfulAction:"Joyful (20'): Kreasi kolase motif tampuk manggis dengan daun kering, kertas emas, biji-bijian. Anak bebas memilih bahan, memberi nama 'Songketku Karya...', pamerkan dengan bangga, bernyanyi Rentak Bulian.",pembukaan:"Salam, doa, menyanyikan Nandung Indragiri Hulu 'La ilaha illallah tidurlah anak...' (3'), apersepsi: 'Siapa yang pernah lihat kain cantik berkilau dipakai Bunda saat kondangan? Itu Songket Inhu! Motifnya seperti mahkota buah, namanya Tampuk Manggis, dari buah manggis yang banyak di kebun kita.' (Mindful - membangkitkan rasa bangga).",inti:`1. Amati (10'): Guru tunjukkan songket asli motif tampuk manggis, anak sentuh dan amati kilau benang emas, tekstur lembut, warna kuning keemasan. Guru: 'Sentuh perlahan, bagaimana rasanya? Berkilau ya?'

3. Eksplorasi (15'): Anak mengelompokkan biji manggis asli, menghitung 5 biji (matematika), membandingkan bentuk daun manggis, mengurutkan dari kecil ke besar. Tugas STEAM: hitung 5 biji = 5 mahkota tampuk manggis.

nggis. Sentuh kain, rasakan lembutnya.",tiru:"Tiru: Jiplak pola tampuk manggis dengan krayon emas. Ikuti garis titik-titik mahkota manggis yang sudah digambar guru, tebalkan dengan krayon emas mengkilap.",eksplorasi:"Eksplorasi: Tempelkan daun kering dan biji manggis pada pola. Susun biji membentuk lingkaran mahkota, hitung 5 biji. Coba variasi: daun di pinggir, kertas emas di tengah.",kreasi:"Kreasi: Warnai dan beri nama karyamu 'Songketku Karya...' dengan kertas emas dan daun. Tempel di kertas HVS tebal, tulis namamu, pamerkan di dinding kelas Pameran Warisan Inhu.",tugas:`1. Kolase motif tampuk manggis dengan daun kering & kertas emas (motorik halus)
