",icon:"\uD83D\uDD4C",color:"#8BA888",fullName:"Keimanan dan Ketakwaan terhadap Tuhan YME"},{id:"kewargaan",label:"Kewargaan",icon:"\uD83C\uDDEE\uD83C\uDDE9",color:"#F97316",fullName:"Kewargaan"},{id:"kritis",label:"Penalaran Kritis",icon:"\uD83E\uDDE0",color:"#60A5FA",fullName:"Penalaran Kritis"},{id:"kreativitas",label:"Kreativitas",icon:"\uD83C\uDFA8",color:"#A78BFA",fullName:"Kreativitas"},{id:"kolaborasi",label:"Kolaborasi",icon:"\uD83E\uDD1D",color:"#34D399",fullName:"Kolaborasi"},{id:"kemandirian",label:"Kemandirian",icon:"\uD83C\uDF31",color:"#FBBF24",fullName:"Kemandirian"},{id:"kesehatan",label:"Kesehatan",icon:"\uD83C\uDFC3",color:"#FB7185",fullName:"Kesehatan (fisik & mental)"},{id:"komunikasi",label:"Komunikasi",icon:"\uD83D\uDCAC",color:"#38BDF8",fullName:"Komunikasi"}],Un={keimanan:{id:"keimanan",numberLabel:"1. Keimanan dan Ketakwaan terhadap Tuhan YME",fullName:"Keimanan dan Ketakwaan terhadap Tuhan Yang Maha Esa",icon:"\uD83D\uDD4C",color:"#8BA888",definisi:"Menurut Permendikdasmen No.13/2025, dimensi Keimanan dan Ketakwaan adalah kemampuan anak mengenal Tuhan sebagai pencipta alam semesta, menunjukkan rasa syukur atas ciptaan-Nya seperti Sungai Siak, daun sawit, ikan, dan keberagaman hayati Riau, serta berperilaku sebagai khalifah kecil yang menjaga amanah bumi dengan adab Melayu Islami, bukan hafalan ritual semata.",dialog:(e,n)=>`Guru: "Sebelum kita mulai ${n.toLowerCase()} hari ini, kita baca apa dulu ya?"
Bintang (5th): "Bismillah Bu!"
Guru: "Pintar, kenapa kita baca Bismillah?"
Bintang: "Supaya Allah sayang, bumi jadi bersih..."
Guru: "Betul, Allah ciptakan Sungai Siak, daun-daun di Pasar Bawah Pekanbaru, semua untuk kita jaga. Kalau bumi kotor, Allah sedih tidak?"
Caca (4th): "Sedih Bu, soalnya ikan di Siak susah napas..."
Guru: "MasyaAllah, Caca sudah peduli. Coba tarik napas, syukuri udara bersih Pekanbaru pagi ini..."
Anak serentak: (tarik napas dalam, hembus pelan)
Guru: "Siapa mau berdoa syukur dengan kata-kata sendiri?"
Arka: "Terima kasih Allah, ada daun, ada botol bisa jadi mainan..."
Guru: "Alhamdulillah, doa Arka indah sekali. Jadi kita jaga bumi sebagai ibadah ya?"
Anak: "Iya Bu! Sampahku tanggung jawabku, karena Allah titipkan bumi!"`,pedagogis:(e,n)=>[`Paragraf 1 - Penting di PAUD: Usia ${e} adalah golden age spiritual. Anak tidak belajar keimanan lewat ceramah, melainkan pembiasaan syukur sehari-hari. Fase Fondasi elemen Nilai Agama & Budi Pekerti menekankan pengenalan Tuhan lewat ciptaan nyata: daun, air hujan Riau, ikan di Sungai Siak. Ketika anak memegang ${n.toLowerCase()}, ia belajar takjub (takzim) sebagai pintu iman.`,"Paragraf 2 - Strategi Deep Learning: Mindful - jeda syukur 5 detik, tarik napas, doa dengan bahasa anak, bukan hafalan panjang. Meaningful - hubungkan sampah di Pasar Bawah dengan tanggung jawab khalifah: jika sampah menumpuk, ikan Siak sebagai ciptaan Allah menderita. Joyful - lagu sholawat lingkungan, cerita legenda Lancang Kuning versi Islami tentang menjaga sungai, tepuk syukur, bukan menakuti dosa.",`Paragraf 3 - Indikator perilaku: Mengucap Bismillah/Alhamdulillah spontan sebelum/sesudah kegiatan ${n.toLowerCase()}, menyebut 2-3 ciptaan Tuhan (daun, air, ikan), menunjukkan empati "kasihan ikan kalau sungai kotor", mengajak teman menjaga kebersihan sebagai ibadah, menggunakan adab Melayu: salam tempel tangan, permisi, terima kasih.`],asesmen:[{title:"Mengenal Tuhan sebagai Pencipta & Bersyukur",BB:"Belum menunjukkan rasa syukur, menolak berdoa",MB:"Mau berdoa jika dipancing guru, menyebut 1 ciptaan",BSH:"Berdoa dengan kesadaran sendiri, menyebut 2-3 ciptaan dan syukur",BSB:"Berdoa kalimat sendiri, mengajak teman bersyukur, hubungkan menjaga bumi sebagai ibadah"},{title:"Perilaku Menjaga Ciptaan",BB:"Membuang sampah sembarangan, acuh",MB:"Membuang sampah jika diingatkan guru",BSH:"Buang sampah pada tempatnya dengan kesadaran, empati ke ikan Siak",BSB:"Mengingatkan teman, aksi nyata bawa botol minum sendiri, jadi duta kebersihan kelas"},{title:"Adab Melayu Islami",BB:"Belum menunjukkan salam/adab",MB:"Menjawab salam jika disapa",BSH:"Salam, permisi, terima kasih spontan",BSB:"Salam tempel tangan, musyawarah, memaafkan, berdoa syukur versi sendiri"}],phases:{pembukaan:{check:!0,desc:"Doa bersama & mindful syukur udara Pekanbaru"},memahami:{check:!0,desc:"Mengagumi ciptaan Tuhan (daun, air Siak)"},mengaplikasi:{check:!0,desc:"Menjaga kebersihan sebagai ibadah khalifah"},merefleksi:{check:!0,desc:"Syukur & empati ke makhluk Tuhan"},penutup:{check:!0,desc:"Doa pulang & janji aksi jaga bumi"}}},kewargaan:{id:"kewargaan",numberLabel:"2. Kewargaan",fullName:"Kewargaan",icon:"\uD83C\uDDEE\uD83C\uDDE9",color:"#F97316",definisi:"Sesuai Permendikdasmen 13/2025, dimensi Kewargaan menekankan rasa cinta tanah air, identitas Melayu Riau, kepedulian terhadap lingkungan bersama seperti Pasar Bawah dan Sungai Siak, kemampuan hidup rukun, gotong royong, menaati aturan bersama, dan berkontribusi sebagai warga kecil Pekanbaru yang bertanggung jawab.",dialog:(e,n)=>`Guru: "Siapa yang pernah ke Pasar Bawah Pekanbaru sama mama?"
Naira: "Aku Bu! Banyak sampah plastik di selokan Pasar Bawah..."
Guru: "Wah, Naira observasinya tajam. Kalau sampah di Pasar Bawah menumpuk, siapa yang rugi?"
Fadil: "Kita semua Bu, jadi bau, banjir kalau hujan!"
Guru: "Itulah tanggung jawab warga Pekanbaru. Apa itu warga?"
Zahra: "Orang yang tinggal di Pekanbaru, harus jaga bersama Bu!"
Guru: "Pintar! Kalau Sungai Siak kotor, perahu Lancang Kuning bisa jalan tidak?"
Anak: "Tidak Bu, tersangkut sampah!"
Guru: "Jadi misi kewargaan kita hari ini apa terkait ${n.toLowerCase()}?"
Bintang: "Gotong royong bersihkan kelas, seperti gotong royong Melayu!"
Guru: "Betul, Melayu ada pepatah 'berat sama dipikul'. Siapa mau jadi ketua gotong royong?"
Caca: "Aku Bu, aku bagi tugas adil!"
Guru: "Bagus, itu musyawarah warga kecil. Tepuk gotong royong!"`,pedagogis:(e,n)=>[`Paragraf 1 - Penting di PAUD: Kewargaan di usia dini bukan pelajaran PPKn, melainkan pengalaman hidup bersama. Anak ${e} belajar bahwa Pasar Bawah, Sungai Siak, Lapangan Purna adalah milik bersama yang harus dijaga. Fase Fondasi menekankan Jati Diri yang berakar budaya Melayu: sopan, gotong royong, malu jika merusak lingkungan.`,`Paragraf 2 - Strategi Deep Learning: Mindful - salam Melayu tempel tangan, menyadari peran diri sebagai bagian dari Pekanbaru. Meaningful - kegiatan ${n.toLowerCase()} dikaitkan dengan konteks nyata: sampah di Pasar Bawah, kebersihan Sungai Siak, cerita Istana Siak. Joyful - bermain peran warga, pasar mainan, perahu Lancang Kuning dari pelepah pisang, tanpa paksaan hafalan.`,"Paragraf 3 - Indikator perilaku: Menyebut Pekanbaru/Riau sebagai rumah bersama, menawarkan bantuan gotong royong, membagi tugas adil, menaati aturan kelas (antri, giliran), mengingatkan teman buang sampah pada tempatnya, bangga memakai atribut Melayu (tanjak mini, songket)."],asesmen:[{title:"Identitas & Cinta Lingkungan Pekanbaru",BB:"Belum mengenal lingkungan sekitar",MB:"Menyebut 1 tempat (Pasar Bawah/Siak) dengan bantuan",BSH:"Menyebut 2 tempat dan rasa cinta ingin menjaga",BSB:"Menceritakan hubungan tempat dengan kehidupan warga & aksi jaga"},{title:"Gotong Royong & Aturan Bersama",BB:"Bermain sendiri, menolak aturan",MB:"Mau gotong royong jika diminta guru",BSH:"Inisiatif gotong royong, patuh aturan giliran",BSB:"Memimpin gotong royong, memediasi konflik, buat aturan bersama"},{title:"Tanggung Jawab Warga Kecil",BB:"Membuang sampah sembarangan",MB:"Buang sampah jika diingatkan",BSH:"Buang sampah kesadaran sendiri, peduli kebersihan kelas",BSB:"Aksi nyata di rumah, ajak keluarga pilah sampah, jadi contoh"}],phases:{pembukaan:{check:!0,desc:"Salam Melayu & cinta Pekanbaru"},memahami:{check:!0,desc:"Mengenal Pasar Bawah & Siak milik bersama"},mengaplikasi:{check:!0,desc:"Gotong royong memilah & membersihkan"},merefleksi:{check:!0,desc:"Dampak sampah untuk warga Pekanbaru"},penutup:{check:!0,desc:"Janji aksi untuk RT/RW"}}},kritis:{id:"kritis",numberLabel:"3. Penalaran Kritis",fullName:"Penalaran Kritis",icon:"\uD83E\uDDE0",color:"#60A5FA",definisi:"Dimensi Penalaran Kritis sesuai Permendikdasmen 13/2025 adalah kemampuan anak usia PAUD mengamati dengan panca indera, membandingkan, mengklasifikasi, mencari sebab-akibat sederhana, mengajukan pertanyaan kritis, dan menemukan solusi terkait fenomena sekitar seperti mengapa daun bisa jadi kompos sedangkan plastik tidak.",dialog:(e,n)=>`Guru: "Coba pegang daun kering ini dan botol plastik ini. Apa bedanya terkait ${n.toLowerCase()}?"
Arka: "Daun lembut Bu, bisa hancur. Plastik keras, tidak bisa hancur..."
Guru: "Hmm, kenapa ya satu bisa kembali jadi tanah, satu tidak?"
Naira: "Soalnya daun dari pohon Bu, alami..."
Guru: "Dari mana kamu tahu?"
Naira: "Mama bikin kompos dari kulit pisang di rumah, jadi tanah lagi!"
Guru: "Wah, penalaran hebat! Kalau plastik kita bakar, apa yang terjadi di Pekanbaru?"
Fadil: "Asapnya hitam Bu, bau, bikin batuk, polusi!"
Guru: "Jadi solusi paling kritis apa untuk plastik dari ${n.toLowerCase()}?"
Zahra: "Jangan dibakar Bu, dipakai lagi jadi pot bunga telang!"
Guru: "Ide kritis! Bagaimana caranya pot itu membantu lingkungan?"
Bintang: "Bisa untuk tanam kangkung Bu, jadi tidak beli plastik lagi, hemat!"
Guru: "Luar biasa, kamu sudah berpikir sebab-akibat seperti ilmuwan kecil Pekanbaru!"`,pedagogis:(e,n)=>[`Paragraf 1 - Penting di PAUD: Penalaran kritis di PAUD bukan debat, melainkan berpikir observatif dan logis. Anak ${e} berada di tahap pra-operasional Piaget: belajar lewat eksplorasi konkret. Mengklasifikasi sampah organik/anorganik melatih STEAM: Sains (observasi), Matematika (menghitung, mengelompokkan), Teknologi (alat).`,'Paragraf 2 - Strategi Deep Learning: Mindful - jeda 3 detik sebelum menjawab, pertanyaan terbuka "Kenapa? Bagaimana kalau?". Meaningful - bahan dari Pasar Bawah Pekanbaru, pengalaman kompos mama di rumah. Joyful - eksperimen lava cuka soda, main tebak-tebakan, tanpa takut salah. Guru tidak langsung mengoreksi, tapi memancing "Dari mana kamu tahu?"','Paragraf 3 - Indikator perilaku: Mengajukan pertanyaan "Kenapa? Bagaimana?", membandingkan 2 benda (daun vs plastik) dengan bahasa sendiri, mengklasifikasi berdasarkan 1-2 atribut, mencari solusi sederhana (jadi pot), memberi alasan sebab-akibat ("Kalau sungai kotor, ikan susah napas").'],asesmen:[{title:"Observasi & Klasifikasi",BB:"Belum mau menyentuh media, menghindar",MB:"Melihat 1 jenis dengan bantuan guru",BSH:"Memilah 2 jenis (organik/anorganik) dengan alasan sederhana",BSB:"Memilah 3+ jenis, alasan kritis, hubungkan pengalaman rumah"},{title:"Bertanya & Mencari Solusi",BB:"Diam, tidak bertanya",MB:"Bertanya 1 kata jika dipancing",BSH:"Bertanya kenapa/bagaimana, usulkan 1 solusi",BSB:"Bertanya berlapis, usulkan 2+ solusi, evaluasi dampak"},{title:"Sebab-Akibat",BB:"Belum memahami sebab-akibat",MB:"Menyebut akibat jika dibantu",BSH:"Menjelaskan sebab-akibat sederhana (plastik dibakar jadi bau)",BSB:"Menjelaskan rantai sebab-akibat panjang & ajak teman bertindak"}],phases:{pembukaan:{check:!0,desc:"Pertanyaan pemantik kenapa daun hancur"},memahami:{check:!0,desc:"Klasifikasi sensori organik/anorganik"},mengaplikasi:{check:!0,desc:"Eksperimen & solusi memilah"},merefleksi:{check:!0,desc:"Evaluasi alasan & penyebab"},penutup:{check:!0,desc:"Rencana investigasi lanjutan di rumah"}}},kreativitas:{id:"kreativitas",numberLabel:"4. Kreativitas",fullName:"Kreativitas",icon:"\uD83C\uDFA8",color:"#A78BFA",definisi:"Kreativitas dalam Permendikdasmen 13/2025 adalah kemampuan anak menghasilkan gagasan, karya, dan tindakan orisinal, luwes, dan bermakna melalui eksplorasi bahan alam Pekanbaru (daun sawit, pelepah pisang, bunga telang), motif songket, dan daur ulang sampah menjadi karya bernilai seperti pot, kolase, dan lentera.",dialog:(e,n)=>`Guru: "Lihat botol bekas ${n.toLowerCase()} ini, biasanya dibuang. Menurut kalian bisa jadi apa?"
Caca: "Bisa jadi roket Bu! Terbang ke langit Pekanbaru!"
Guru: "Wah imajinatif! Kalau jadi roket, pakai apa biar bisa terbang?"
Caca: "Pakai daun sebagai sayap Bu!"
Guru: "Keren! Siapa punya ide lain yang beda dari Caca?"
Arka: "Aku mau jadi pot gantung Bu, dicat warna pelangi Riau!"
Guru: "Warna pelangi seperti sore di Lapangan Purna ya? Bagaimana cara catnya?"
Arka: "Pakai jari Bu, cap jari pelangi!"
Guru: "Itu finger painting kreatif! Tidak harus sama contoh Bu kan?"
Anak: "Tidak Bu, bebas!"
Guru: "Betul, kreativitas itu berani beda. Coba buat karya versi kalian, tidak ada salah!"
Zahra: "Bu, aku mau tambah pita dari songket bekas Siak!"
Guru: "MasyaAllah, kolase budaya Melayu! Silakan, Bu tunggu cerita karyamu!"`,pedagogis:(e,n)=>[`Paragraf 1 - Penting di PAUD: Kreativitas bukan bakat, melainkan keberanian mencoba dan memodifikasi. Di usia ${e}, anak berada pada puncak imajinasi simbolik. Larangan "harus rapi sama seperti contoh" membunuh kreativitas. Regulasi melarang LKS mewarnai harus di dalam garis, mendorong karya bebas dari bahan alam Pekanbaru.`,"Paragraf 2 - Strategi Deep Learning: Mindful - memberi waktu jeda tanpa buru-buru selesai, menghargai proses. Meaningful - bahan kontekstual Riau: songket Siak, daun karet, bunga telang, botol bekas Pasar Bawah. Joyful - tidak ada penilaian benar-salah, tepuk ide unik, pamer karya di dinding kelas, anak bercerita. Diferensiasi: ada yang melukis, menempel, merobek, semua dihargai.","Paragraf 3 - Indikator perilaku: Mengusulkan ide orisinal (roket dari botol), memodifikasi contoh guru (tambah pita songket), menggunakan bahan tidak biasa (bunga telang sebagai cat), menceritakan karya dengan bangga, tidak takut salah, mengapresiasi karya teman yang beda."],asesmen:[{title:"Ide Orisinal & Luwes",BB:"Meniru persis contoh guru, takut beda",MB:"Meniru dengan 1 modifikasi kecil",BSH:"Ide beda dari teman, 1-2 modifikasi",BSB:"Ide sangat orisinal, banyak modifikasi, cerita unik"},{title:"Eksplorasi Bahan",BB:"Hanya 1 bahan, menunggu disuapi",MB:"Mencoba 2 bahan dengan bantuan",BSH:"Mencoba 3 bahan mandiri, kombinasikan",BSB:"Kombinasi bahan tak biasa (songket+daun+plastik), jelaskan alasan"},{title:"Kepercayaan Diri Berkarya",BB:"Menangis, menolak berkarya",MB:"Mau berkarya jika ditemani",BSH:"Berkarya mandiri dengan sedikit bantuan",BSB:"Berkarya mandiri, presentasi bangga, ajak teman coba"}],phases:{pembukaan:{check:!1,desc:"Inspirasi gambar pelangi Riau"},memahami:{check:!0,desc:"Mengamati tekstur & warna bahan alam"},mengaplikasi:{check:!0,desc:"Membuat pot/kolase dari sampah daur ulang"},merefleksi:{check:!0,desc:"Menceritakan karya dengan bangga"},penutup:{check:!1,desc:"Memajang karya di galeri kelas"}}},kolaborasi:{id:"kolaborasi",numberLabel:"5. Kolaborasi",fullName:"Kolaborasi",icon:"\uD83E\uDD1D",color:"#34D399",definisi:'Kolaborasi sesuai Permendikdasmen 13/2025 adalah kemampuan anak bekerja bersama, berbagi peran, bergiliran, bernegosiasi, dan menyelesaikan konflik secara damai dalam kelompok kecil, mencerminkan nilai Melayu "berat sama dipikul, ringan sama dijinjing" saat memilah sampah atau membuat karya daur ulang.',dialog:(e,n)=>`Guru: "Kita punya 10 botol untuk ${n.toLowerCase()}, tapi 4 kelompok. Bagaimana biar adil?"
Bintang: "Dibagi dua-dua Bu, sisanya gantian!"
Guru: "Siapa yang mau membagi?"
Caca: "Aku sama Naira Bu!"
Guru: "Bagaimana cara Caca dan Naira bekerja sama?"
Caca: "Naira hitung, aku bagikan Bu!"
Guru: (mendekati dua anak rebutan gunting) "Bu lihat kalian mau gunting yang sama, solusinya?"
Fadil: "Aku dulu ya, 2 menit, nanti kamu..."
Zahra: "Oke, aku pakai gunting lain dulu, tidak apa!"
Guru: "Wah, negosiasi dewasa! Itu namanya musyawarah, seperti rapat di Balai Adat Melayu."
Arka: "Bu, kelompok kami sudah selesai memilah, boleh bantu kelompok lain?"
Guru: "Boleh sekali, itu empati kolaborasi! Bagaimana bantuannya?"
Arka: "Kami bawakan lem Bu!"
Guru: "Tepuk kolaborasi untuk Arka! Siapa lagi mau membantu?"`,pedagogis:(e,n)=>[`Paragraf 1 - Penting di PAUD: Kolaborasi adalah fondasi kecerdasan sosial. Anak ${e} belajar dari konflik kecil (rebutan gunting) menjadi kesempatan belajar regulasi emosi dan bahasa. Teori Vygotsky: belajar terjadi dalam interaksi sosial. Gotong royong Melayu adalah modal kultural Pekanbaru untuk kolaborasi.`,'Paragraf 2 - Strategi Deep Learning: Mindful - jeda sebelum bereaksi saat rebutan, tarik napas, gunakan kata "boleh pinjam?". Meaningful - tugas bermakna bersama: memilah sampah Pasar Bawah, bukan tugas individual. Joyful - tepuk kolaborasi, penghargaan kelompok bukan individu, permainan tradisional Gasing dan Congkak yang butuh giliran.','Paragraf 3 - Indikator perilaku: Menawarkan bantuan tanpa diminta, membagi alat adil, menggunakan kalimat santun "boleh pinjam?", menunggu giliran, memediasi teman konflik, memberi apresiasi "wah bagus idemu!", bekerja dalam peran berbeda (penghitung, pembagi, pencatat).'],asesmen:[{title:"Berbagi & Giliran",BB:"Merebut, menolak berbagi",MB:"Berbagi jika diminta guru",BSH:"Berbagi inisiatif sendiri, tunggu giliran",BSB:"Bagi tugas adil, atur giliran kelompok, jadi mediator"},{title:"Negosiasi & Musyawarah",BB:"Menangis/marahi teman saat konflik",MB:"Diam saat konflik, butuh guru",BSH:"Gunakan kalimat sederhana untuk negosiasi",BSB:"Negosiasi dengan kalimat lengkap, musyawarah, solusi win-win"},{title:"Empati & Bantuan",BB:"Acuh pada teman kesulitan",MB:"Melihat tapi tidak membantu",BSH:"Menawarkan bantuan jika diminta",BSB:"Inisiatif bantu kelompok lain, bawa alat, beri semangat"}],phases:{pembukaan:{check:!0,desc:"Bagi kelompok & salam kolaboratif"},memahami:{check:!0,desc:"Berbagi alat observasi sensori"},mengaplikasi:{check:!0,desc:"Bagi tugas adil memilah sampah"},merefleksi:{check:!0,desc:"Apresiasi karya teman"},penutup:{check:!0,desc:"Beres-beres bersama gotong royong"}}},kemandirian:{id:"kemandirian",numberLabel:"6. Kemandirian",fullName:"Kemandirian",icon:"\uD83C\uDF31",color:"#FBBF24",definisi:"Kemandirian menurut Permendikdasmen 13/2025 adalah kemampuan anak mengatur diri, mengambil inisiatif, mencoba sendiri, bertanggung jawab terhadap alat dan karya, serta menunjukkan percaya diri dalam kegiatan PAUD seperti menggunting botol, menempel kolase, dan membereskan alat tanpa bergantung penuh pada guru.",dialog:(e,n)=>`Guru: "Hari ini siapa yang mau mencoba menggunting botol untuk ${n.toLowerCase()} sendiri?"
Bintang: "Aku Bu, tapi takut salah..."
Guru: "Tidak apa salah, coba dulu. Mau Bu pegang botolnya saja?"
Bintang: (mencoba) "Bisa Bu! Walau miring sedikit..."
Guru: "Miring tidak apa, yang penting usaha sendiri. Bagaimana rasanya?"
Bintang: "Bangga Bu, hangat di dada!"
Guru: "Itu namanya mandiri! Siapa yang sudah selesai, apa yang dilakukan?"
Caca: "Bereskan gunting dan lap meja sendiri Bu!"
Guru: "Hebat, tanpa disuruh! Kalau di rumah Pasar Bawah, bisa apa sendiri?"
Naira: "Bisa buang kulit bawang ke kompos sendiri Bu, tidak disuruh mama!"
Guru: "Wah, kemandirian sampai rumah! Apa rencana besok terkait ${n.toLowerCase()}?"
Fadil: "Mau pakai botol minum sendiri Bu, tidak minta plastik!"
Guru: "Janji kemandirian yang keren! Bu catat di jurnal refleksi ya."`,pedagogis:(e,n)=>[`Paragraf 1 - Penting di PAUD: Kemandirian adalah tujuan utama Fase Fondasi: anak mampu melakukan self-care dan self-management. Anak ${e} sedang mengembangkan otonomi vs rasa malu (Erikson). Jika guru selalu mengambil alih menggunting, anak belajar helplessness. Memberi kesempatan mencoba, walau miring, membangun growth mindset.`,'Paragraf 2 - Strategi Deep Learning: Mindful - check-in "Bagaimana rasanya bangga di tubuh?", memberi jeda tanpa buru-buru membantu. Meaningful - tugas nyata: memilah sampah dapur, bawa botol minum sendiri, bukan LKS abstrak. Joyful - tepuk mandiri, stiker "Aku Bisa", tidak ada hukuman salah, scaffolding bertahap: pegang botol saja, lalu lepas.','Paragraf 3 - Indikator perilaku: Mencoba sendiri tanpa diminta, meminta bantuan spesifik bukan total ("Bu pegangin botolnya saja"), membereskan alat tanpa disuruh, membuat rencana aksi untuk rumah ("besok bawa botol minum"), menyampaikan rasa bangga dengan bahasa tubuh dan kata-kata.'],asesmen:[{title:"Inisiatif & Usaha Mandiri",BB:"Menunggu disuapi/guru kerjakan",MB:"Mau mencoba dengan bantuan penuh",BSH:"Mencoba sendiri dengan sedikit bantuan",BSB:"Mandiri penuh dari awal-akhir, berani coba hal baru"},{title:"Tanggung Jawab Alat & Karya",BB:"Meninggalkan alat berantakan",MB:"Membereskan jika diingatkan",BSH:"Membereskan inisiatif sendiri",BSB:"Membereskan + bantu teman bereskan, jaga kebersihan"},{title:"Percaya Diri & Rencana Aksi",BB:"Menangis, menolak coba",MB:"Mau coba jika ditemani",BSH:"Bangga setelah berhasil, cerita singkat",BSB:"Bangga, cerita detail, buat janji aksi di rumah"}],phases:{pembukaan:{check:!0,desc:"Check-in emosi mandiri & salam"},memahami:{check:!0,desc:"Memilih bahan yang disukai sendiri"},mengaplikasi:{check:!0,desc:"Mengerjakan pot/karya sendiri"},merefleksi:{check:!0,desc:"Menyampaikan perasaan & rencana aksi"},penutup:{check:!0,desc:"Membereskan alat sendiri"}}},kesehatan:{id:"kesehatan",numberLabel:"7. Kesehatan (fisik & mental)",fullName:"Kesehatan (fisik & mental)",icon:"\uD83C\uDFC3",color:"#FB7185",definisi:"Dimensi Kesehatan fisik dan mental sesuai Permendikdasmen 13/2025 mencakup kemampuan anak menjaga kebersihan diri, keselamatan saat eksplorasi sampah dan alat tajam, mengenali sinyal tubuh (lelah, pegal, senang), serta regulasi emosi (sedih lihat Sungai Siak kotor, bangga berhasil) sebagai fondasi well-being di PAUD.",dialog:(e,n)=>`Guru: "Sebelum pegang sampah untuk ${n.toLowerCase()}, apa yang harus kita pakai?"
Zahra: "Celemek dan sarung tangan Bu, biar bersih!"
Guru: "Betul, kenapa harus bersih?"
Arka: "Biar tidak sakit Bu, kuman banyak di sampah..."
Guru: "Pintar! Coba tarik napas, hirup... hembus... bagaimana tubuhmu sekarang?"
Bintang: "Segar Bu, tapi tangan pegal habis gunting..."
Guru: "Kalau pegal, apa yang kita lakukan?"
Caca: "Goyang-goyang tangan Bu, istirahat sebentar!"
Guru: "Itu mindful tubuh! Setelah memilah, kita harus apa?"
Naira: "Cuci tangan pakai sabun Bu, 20 detik!"
Guru: "Sambil nyanyi apa?"
Anak: "Nyanyi lagu cuci tangan Bu, sambil lihat jam!"
Guru: "Asyik! Sehat fisik dan mental ya. Kalau hati sedih lihat Sungai Siak kotor, boleh cerita ke Bu?"
Fadil: "Boleh Bu, jadi lega kalau cerita..."
Guru: "Betul, cerita itu obat hati sehat. Tepuk sehat!"`,pedagogis:(e,n)=>[`Paragraf 1 - Penting di PAUD: Kesehatan holistik adalah prasyarat belajar. Anak ${e} yang lapar, lelah, atau cemas tidak bisa fokus. Permendikdasmen menekankan PAUD Holistik Integratif: gizi, kebersihan, keselamatan, dan kesehatan mental saling terkait. Kegiatan ${n.toLowerCase()} yang melibatkan sampah harus memperhatikan APD sederhana (celemek, sarung tangan).`,'Paragraf 2 - Strategi Deep Learning: Mindful - body scan sederhana "Pegal di mana? Senang di dada?", jeda istirahat, tarik napas. Meaningful - cuci tangan 20 detik setelah pegang sampah, pakai celemek, bukan aturan abstrak tapi pengalaman nyata menjaga diri dari kuman Pasar Bawah. Joyful - senam Melayu, lagu cuci tangan, gerakan goyang tangan, minum air bersama, tanpa menakuti.',"Paragraf 3 - Indikator perilaku: Memakai celemek/sarung tangan tanpa disuruh, mencuci tangan dengan benar, mengenali sinyal tubuh (pegal, lelah, senang), meminta istirahat, menyampaikan emosi sedih/bangga, menggunakan strategi regulasi (tarik napas, cerita ke guru), menjaga jarak aman saat pakai gunting."],asesmen:[{title:"Kebersihan & Keselamatan Diri",BB:"Menolak pakai celemek, tidak cuci tangan",MB:"Pakai celemek jika diingatkan, cuci tangan asal",BSH:"Pakai celemek inisiatif, cuci tangan 20 detik benar",BSB:"Ingatkan teman pakai celemek, cuci tangan + jelaskan alasan kuman"},{title:"Mengenali Sinyal Tubuh",BB:"Tidak mengenali lelah/pegal",MB:"Mengenal jika ditanya guru",BSH:"Menyampaikan pegal/lelah/senang spontan",BSB:"Menyampaikan + minta solusi (istirahat, minum)"},{title:"Regulasi Emosi",BB:"Menangis marah tanpa bisa ditenangkan",MB:"Tenang jika dipeluk guru",BSH:"Tarik napas, cerita perasaan sedih/bangga",BSB:"Gunakan strategi mandiri (napas, cerita, peluk) & bantu teman"}],phases:{pembukaan:{check:!0,desc:"Senam & tarik napas mindful"},memahami:{check:!0,desc:"Mengenali bahaya sampah untuk tubuh"},mengaplikasi:{check:!0,desc:"Cuci tangan, celemek, gerakan aman"},merefleksi:{check:!0,desc:"Mengenali rasa lelah/bangga di tubuh"},penutup:{check:!0,desc:"Minum air & salam sehat"}}},komunikasi:{id:"komunikasi",numberLabel:"8. Komunikasi",fullName:"Komunikasi",icon:"\uD83D\uDCAC",color:"#38BDF8",definisi:"Dimensi Komunikasi sesuai Permendikdasmen 13/2025 adalah kemampuan anak menyampaikan ide, perasaan, dan pengalaman tentang tema dengan bahasa lisan, gestur, dan karya, mendengarkan aktif teman, serta menggunakan bahasa Melayu santun (tolong, maaf, terima kasih) dalam konteks Pekanbaru.",dialog:(e,n)=>`Guru: "Coba ceritakan dengan kata-katamu tentang ${n.toLowerCase()} yang kamu pegang?"
Bintang: "Ini daun kering Bu, warnanya coklat, bunyinya kresek-kresek kalau diremas..."
Guru: "Deskripsi hebat! Pakai panca indera ya. Coba ceritakan ke teman sebelah."
Caca ke Naira: "Naira, ini botolku, mau aku jadi pot bunga telang, warnanya biru nanti seperti langit Pekanbaru..."
Naira: "Wah ide bagus Caca! Boleh aku lihat cara potongnya?"
Guru: "Komunikasi santun! Ada kata 'boleh' dan 'tolong' ya. Kalau tidak setuju, bilangnya bagaimana?"
Fadil: "Jangan marah Bu, bilangnya 'Aku punya ide lain, bagaimana kalau...'"
Guru: "Luar biasa, itu komunikasi asertif! Siapa mau presentasi karya?"

[Anak pulang dengan membawa pot karya dan jurnal refleksi kecil]`,pedagogis:["Paragraf 1 - Joyful Closing: Penutup dirancang sebagai joyful closing, bukan penutup yang menegangkan dengan pertanyaan tes. Tepuk, nyanyi, dan gerakan membuat anak pulang dengan emosi positif (peak-end rule - Kahneman: anak akan ingat puncak kegembiraan dan akhir yang menyenangkan). Ini mendukung dimensi Kesehatan mental dan Kemandirian karena anak pulang dengan rasa kompeten. Teori Self-Determination Theory (Deci & Ryan) terpenuhi: autonomy (memilih tugas rumah), competence (karya dibawa pulang), relatedness (salam tempel tangan).",'Paragraf 2 - Syukur & Keimanan: Aktivitas syukur "Apa yang paling kamu syukuri?" adalah implementasi elemen Nilai Agama & Budi Pekerti yang tidak doktriner, melainkan reflektif dan personal. Anak belajar gratitude sebagai kebiasaan (habit) bukan hafalan doa saja. Ini sejalan dengan Permendikdasmen 13/2025 yang menekankan profil lulusan berkeimanan yang diwujudkan dalam perilaku sehari-hari menjaga lingkungan, bukan sekadar ritual.','Paragraf 3 - Jembatan Rumah & Keberlanjutan: Tugas "tidak wajib tapi boleh" adalah strategi diferensiasi dan menghargai otonomi keluarga. Tidak ada paksaan, sehingga tidak membebani orang tua. Namun jembatan ini memastikan pembelajaran bermakna berlanjut (home-school connection) yang sangat ditekankan dalam panduan PAUD Holistik Integratif. Membawa pot karya pulang memberi kebanggaan dan media komunikasi anak-orang tua, sekaligus portofolio yang bisa dilihat perkembangan prosesnya dari hari ke hari.']}]}function ll({text:e}){let[n,t]=q.useState(!1);return c("div",{className:"relative inline-block",children:[o("button",{onClick:()=>t(!n),className:"w-5 h-5 rounded-full bg-[var(--sage-light)] text-[var(--sage)] flex items-center justify-center text-[11px] font-bold hover:bg-[var(--sage)] hover:text-white transition",children:"?"}),n&&c("div",{className:"absolute z-50 left-0 top-7 w-72 p-3 rounded-2xl bg-[#2D2A26] text-white text-[12
