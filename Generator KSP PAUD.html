A. Latar Belakang

1. Landasan Filosofis
Pendidikan Anak Usia Dini (PAUD) pada hakikatnya adalah peletakan fondasi bagi pembentukan manusia seutuhnya sebagaimana diamanatkan oleh Ki Hajar Dewantara bahwa pendidikan merupakan tuntunan kodrat anak untuk mencapai keselamatan dan kebahagiaan setinggi-tingginya. Kurikulum Satuan Pendidikan (KSP) ${e.nama} Tahun Ajaran ${e.tahunAjaran} disusun dengan kesadaran filosofis bahwa anak usia 4-6 tahun adalah pribadi yang unik, aktif, dan pembelajar sejati yang belajar melalui bermain. Oleh karena itu, paradigma pembelajaran mendalam (deep learning) ditempatkan sebagai poros utama, bukan sekadar pemindahan pengetahuan dari guru kepada murid, melainkan proses memerdekakan pikiran, rasa, dan karsa anak.

2. Landasan Sosiologis dan Historis PAUD di Indragiri Hulu
Kabupaten Indragiri Hulu merupakan wilayah dengan identitas Melayu Islam Beradat yang sangat kental, di mana falsafah "Adat Bersendi Syara', Syara' Bersendi Kitabullah" menjadi pedoman hidup masyarakat. Secara historis, pendidikan di Inhu tumbuh dari surau, balai adat, dan madrasah kampung sebelum menjadi lembaga formal. Anak-anak di ${e.kecamatan} tumbuh dalam ekosistem Sungai Indragiri yang menjadi urat nadi transportasi, ekonomi, dan kebudayaan, serta hamparan perkebunan kelapa sawit dan karet rakyat yang menjadi sumber penghidupan utama. Realitas sosiologis ini menuntut kurikulum yang tidak tercabut dari akar budaya. Anak tidak dapat dipisahkan dari cerita nenek tentang buaya dan kancil di tepi sungai, dari irama zapin, dari aroma tanah basah kebun setelah hujan, dan dari pantun Melayu yang menjadi medium komunikasi. KSP ini menjawab kebutuhan tersebut dengan menjadikan budaya Melayu dan potensi lokal sebagai sumber belajar yang hidup.

A. Prinsip Dasar Pembelajaran PAUD di ${e.nama}

Sesuai Permendikdasmen Nomor 1 Tahun 2026 tentang Standar Proses, pembelajaran PAUD harus memenuhi empat prinsip utama. Pertama, bermain bermakna (play with purpose) di mana setiap sudut main memiliki tujuan perkembangan yang jelas, bukan sekadar mengisi waktu kosong. Bermain adalah kerja anak, dan melalui bermain anak mengembangkan seluruh aspek perkembangan. Kedua, eksplorasi dan inkuiri, di mana anak didorong untuk menemukan sendiri melalui percobaan sederhana, bertanya, dan mencari jawaban dengan bimbingan guru sebagai fasilitator. Ketiga, proses lebih penting daripada hasil akhir (process over product), sehingga tidak ada tuntutan untuk menghasilkan produk yang seragam dan sempurna. Keempat, lingkungan sebagai sumber belajar ketiga (third teacher), di mana kebun, sungai, pasar, surau, dan balai adat menjadi kelas yang sesungguhnya. Di ${e.nama} yang berada di ${e.kecamatan}, prinsip ini diterjemahkan dengan menata halaman sekolah menjadi laboratorium hidup.

B. Transkripsi Mendalam Tiga Pilar Deep Learning di PAUD

Permendikdasmen 13/2025 Pasal 3 ayat (2) menegaskan pembelajaran mendalam dilaksanakan melalui tiga pilar yang saling berkaitan dan tidak terpisahkan:

1. MINDFUL LEARNING (Belajar dengan Kesadaran Penuh)
Mindful di PAUD berarti anak diajak hadir penuh pada saat ini (present moment), menyadari diri, emosi, tubuh, dan lingkungan sekitarnya. Di konteks Indragiri Hulu, mindful diwujudkan melalui ritual pagi: anak duduk melingkar di tikar pandan, menarik napas dalam, mendengarkan bunyi alam sekitar seperti angin yang menggerakkan pelepah sawit, aliran air, suara azan dari surau, dan kicauan burung. Guru bertanya dengan lembut: "Apa yang kamu dengar? Apa yang kamu rasakan pagi ini?". Anak belajar mengenali emosi melalui kartu emosi bergambar wajah Melayu. Ketika terjadi konflik perebutan mainan, anak tidak langsung dimarahi, tetapi diajak pause, tarik napas, minum air, baru kemudian berbicara dengan kalimat "Aku merasa sedih ketika...". Di tepian Sungai Indragiri, mindful berarti menyadari bahwa sampah plastik yang dibuang sembarangan akan mengganggu ikan patin. Anak diajak memungut sampah dengan penuh kesadaran, bukan karena disuruh, tetapi karena ia merasakan keterhubungan dengan sungai. Mindful melatih regulasi emosi dan empati, fondasi dari dimensi Kesehatan dan Keimanan.

2. MEANINGFUL LEARNING (Belajar Bermakna dan Terkoneksi)
Meaningful berarti pengetahuan baru dikaitkan dengan pengalaman, pengetahuan awal, dan kehidupan nyata anak, sehingga pengetahuan menjadi hidup dan bertahan lama. Di ${e.nama}, meaningful dibangun dengan menghubungkan konsep akademik dengan kehidupan keluarga petani sawit dan karet. Contoh konkret: Mengenal bilangan bukan dengan lembar kerja steril, tetapi dengan menghitung janjang sawit (tandan buah segar) yang dibawa ayah dari kebun, menghitung biji karet yang memantul, atau menghitung anak tangga surau. Mengenal huruf melalui nama-nama yang ada di sekitar: S untuk Sawit, K untuk Karet, I untuk Indragiri, P untuk Patin. Pada projek P5 "Mengenal Sawit", anak tidak hanya melihat gambar sawit, tetapi berkunjung ke kebun (fisik atau virtual), melihat bagaimana brondolan dipanen, bagaimana minyak goreng dihasilkan dari sawit, mengapa harga sawit naik turun memengaruhi uang jajan, dan mengapa harus menjaga lingkungan agar tidak terjadi kebakaran lahan. Pengetahuan menjadi hidup karena ada cerita keluarga di dalamnya. Anak yang ayahnya petani sawit merasa dihargai ketika ceritanya masuk ke kelas. Inilah hakikat meaningful yang menumbuhkan penalaran kritis dan kewargaan.

3. JOYFUL LEARNING (Belajar dengan Gembira dan Memerdekakan)
Joyful bukan berarti kelas bising tanpa aturan, melainkan gembira karena dihargai, boleh memilih, boleh mencoba, boleh salah, dan boleh tertawa. Joyful adalah indikator bahwa anak merasa aman dan merdeka. Di ${e.nama}, joyful hadir melalui: Gerak dan lagu Zapin anak dengan selendang warna kuning-hijau khas Melayu, di mana anak bergerak bebas mengikuti irama gendang; Pacu Jalur mini menggunakan kardus panjang di halaman, di mana anak berdayung bersama sambil berteriak "kayuh... kayuh..." dengan gembira; Pasar-pasanan menggunakan daun pisang sebagai uang dan batu kerikil sebagai kembalian; Cerita Pak Belalang dan Lebai Malang yang dibawakan dengan boneka. Guru tidak membentak dengan kata "salah!", tetapi menyanyi dengan irama Melayu: "Ayo kita simpan, simpan mainannya, kalau rapi, hati pun senang...". Kegembiraan ini memicu dopamin yang memperkuat memori dan motivasi intrinsik, sesuai prinsip neuroscience.

C. Larangan Calistung Paksa dan Penguatan Bermain sebagai Inti

Dokumen ini menegaskan larangan calistung (baca tulis hitung) secara paksa, drilling, dan pemberian pekerjaan rumah akademik yang membebani anak. Sesuai Standar Isi PAUD, literasi dibangun melalui bermain bahasa yang kaya: mendengarkan cerita, bernyanyi, bermain peran, bermain keaksaraan di sudut baca. Numerasi dibangun melalui bermain balok, bermain air dan pasir, dan permainan tradisional congkak. Sains dibangun melalui eksplorasi alam. Paksaan calistung hanya akan menghasilkan kemampuan semu yang cepat hilang dan menimbulkan trauma belajar. Oleh karena itu, di ${e.nama} tidak ada tes membaca menulis berhitung untuk masuk TK B apalagi untuk masuk SD. Transisi PAUD-SD yang menyenangkan dijaga dengan komunikasi intensif kepada SD sekitar ${e.kecamatan}.

D. Struktur Kurikulum dan P5 di PAUD

Alokasi waktu mengacu pada Permendikdasmen 13/2025: 5 hari per minggu, 900 menit per minggu untuk TK A/B (3 jam per hari). Rinciannya: Intrakurikuler 70% meliputi kegiatan pembukaan, inti (sentra), dan penutup yang berbasis Capaian Pembelajaran (CP) Fase Fondasi. Kokurikuler berupa Projek Penguatan Profil Pelajar Pancasila (P5) 20% dilaksanakan 2-3 projek per tahun, setiap projek berlangsung 2-3 minggu secara mendalam, bukan seremonial. Ekstrakurikuler pilihan 10% sesuai minat dan ciri khas, seperti Tari Zapin Anak dan Silat Melayu setiap Jumat sore, Pacu Jalur Mini dan Permainan Rakyat setiap Senin, Mengenal Sawit dan Karet - Little Farmers setiap Rabu, Batik Riau Cap dan Anyaman Pandan setiap Kamis, serta Tahfidz Juz Amma dan Pantun Melayu 15 menit setiap hari.

Contoh Lengkap Tema Sawit sebagai Deep Learning:
Mindful: Anak diajak menyentuh dan mencium tekstur pelepah sawit, merasakan duri halus, mendengar bunyi pelepah ketika dipukul pelan, menyadari bahwa sawit memiliki kehidupan. Meaningful: Guru mengajak anak menghubungkan sawit dengan minyak goreng di dapur ibu, sabun, margarin, dan uang sekolah yang berasal dari hasil kebun ayah. Anak diajak berpikir kritis: apa yang terjadi jika kebun terbakar? Bagaimana cara panen yang aman tanpa merusak pohon? Joyful: Anak membuat karya dari pelepah sawit, lidi, dan brondolan: membuat capung, perahu, mahkota raja Melayu. Mereka tertawa, berkolaborasi, dan memamerkan karya di gelar karya. Inilah pembelajaran mendalam yang utuh.

E. Pengaturan Kelas dan Muatan Lokal Melayu

Muatan Lokal Wajib Melayu Riau meliputi Bahasa Melayu, Adat Istiadat, dan Seni Budaya. Muatan Lokal Inhu meliputi pengetahuan tentang Kebun Raya, Sungai Indragiri, dan Adat Petalangan. Kelas dibagi menjadi Kelompok A (4-5 tahun) dan Kelompok B (5-6 tahun) dengan rasio guru maksimal 1:15 sesuai Standar Pengelolaan. Penataan ruang menggunakan model sentra: Sentra Alam (berisi tanah, pasir sungai, biji-bijian), Sentra Seni Melayu (berisi alat musik kompang, selendang zapin, canting batik dari pelepah), Sentra Persiapan (tanpa LKS, tetapi dengan permainan bahasa dan matematika manipulatif), dan Sentra Balok (balok kayu karet).`}function Dl(e){return`BAB V - PERENCANAAN PEMBELAJARAN

A. Capaian Pembelajaran (CP) PAUD - Fase Fondasi - Transkripsi Lengkap

Merujuk pada Permendikdasmen Nomor 12 Tahun 2025 tentang Standar Isi dan Kepmendikdasmen Nomor 262/M/2022 tentang Capaian Pembelajaran, CP PAUD untuk Fase Fondasi (usia 4-6 tahun) meliputi tiga elemen yang saling terintegrasi dan tidak diajarkan secara terpisah:

Elemen 1: Nilai Agama dan Budi Pekerti
CP-nya berbunyi: Anak mengenal dan meyakini Tuhan Yang Maha Esa, mengenal ciptaan-Nya, menunjukkan perilaku berakhlak mulia, serta menghormati keberagaman. Di ${e.nama}, CP ini diterjemahkan menjadi pembiasaan wudhu sebelum kegiatan, shalat dhuha berjamaah, doa sebelum makan dengan kesadaran bahwa nasi berasal dari sawah petani, mengenal Asmaul Husna melalui nyanyian, merawat tanaman dan ikan sebagai bentuk syukur, serta mengucapkan salam dan pantun Melayu ketika bertamu. Penilaian dilakukan melalui observasi, bukan tes hafalan.

Elemen 2: Jati Diri
Jati Diri meliputi perkembangan fisik-motorik, sosial-emosional, dan kemandirian. Fisik-motorik: CP-nya adalah anak mampu mengoordinasikan gerakan motorik kasar dan halus untuk berpartisipasi dalam aktivitas sehari-hari. Contoh di Inhu: meniti pematang sawah (simulasi di halaman), memanjat, menari zapin, menganyam pandan, memindahkan biji karet dengan capit. Sosial-emosional: anak mampu mengenali, mengelola, dan mengekspresikan emosi secara wajar serta membangun interaksi sosial positif. Diwujudkan dengan kartu emosi, cerita tentang malu dan berani ala Melayu, dan kegiatan berbagi bekal. Kemandirian: anak mampu melakukan kegiatan personal secara mandiri dan bertanggung jawab, seperti memakai baju teluk belanga sendiri, membereskan alat main, mencuci piring bekal, dan berani menyampaikan ide di depan teman.

Elemen 3: Dasar-dasar Literasi, Matematika, Sains, Teknologi, Seni (STEAM)
Literasi: anak mampu memahami dan menggunakan bahasa lisan untuk berkomunikasi, menunjukkan minat terhadap keaksaraan awal, dan memahami informasi sederhana. Di ${e.nama}, literasi dibangun melalui sudut baca lontar Melayu, mendongeng kisah Petalangan, bermain peran pasar tani, dan menulis permulaan melalui coretan bermakna, bukan menebalkan huruf secara mekanis.
Matematika: anak mampu mengenal konsep bilangan, pola, geometri, dan pengukuran melalui eksplorasi. Contoh bermakna: mengelompokkan brondolan sawit besar-kecil, membuat pola dari biji karet, mengukur panjang sungai mini dengan langkah kaki, dan membandingkan berat daun pisang.
Sains: anak mampu melakukan eksplorasi lingkungan untuk menemukan konsep sains sederhana. Contoh deep learning: percobaan mengapa pelepah sawit mengapung dan batu tenggelam di miniatur Sungai Indragiri, mengamati siklus hidup kupu-kupu di kebun, dan mengamati perubahan warna daun.
Teknologi: anak mengenal teknologi sederhana di lingkungan, seperti alat panen sawit (egrek, dodos) yang aman diperkenalkan melalui gambar, dan menggunakan kaca pembesar untuk mengamati serangga.
Seni: anak mampu mengekspresikan diri melalui seni rupa, musik, tari, dan drama. Contoh: membuat cap batik Riau dari pelepah pisang, menari zapin dengan selendang, bermain kompang, dan membuat cerita dari tanah liat.

B. Prinsip Penyusunan Tujuan Pembelajaran (TP) dan Alur Tujuan Pembelajaran (ATP)

TP disusun dari CP menjadi tujuan yang lebih operasional, konkret, terukur, tetapi tetap naratif dan tidak kaku. Prinsip penyusunan TP di ${e.nama} adalah:
1. Berbasis CP dan Kontekstual: Setiap TP harus merujuk pada CP dan dikaitkan dengan konteks Inhu. Format penulisan: "Anak mampu [kata kerja operasional] [objek/konsep] melalui [cara/strategi] dengan [konteks lokal Inhu]". Contoh: "Anak mampu menyebutkan 3 bagian tanaman sawit (akar, batang, buah) melalui pengamatan langsung di kebun sekolah dengan penuh kesadaran".
2. Berjenjang dan Berurutan: TP disusun dari mudah ke sulit, dari konkret ke abstrak, dari dekat ke jauh sesuai perkembangan anak.
3. Memuat 3 Pilar Deep Learning: Setiap TP secara eksplisit atau implisit memuat unsur mindful, meaningful, joyful.

Alur Tujuan Pembelajaran (ATP) adalah rangkaian TP yang disusun secara logis dalam satu fase. Contoh ATP Semester 1 Kelompok B Tahun ${e.tahunAjaran} dengan Tema "Aku Anak Melayu Indragiri Hulu":
Minggu 1-2: Aku dan Identitasku - mengenal nama lengkap, alamat Desa ${e.desa}, suku Melayu, dan ciri fisik diri sebagai ciptaan Allah.
Minggu 3-4: Keluargaku di Kebun - peran ayah sebagai petani sawit/karet, ibu sebagai pengelola rumah dan kebun, kakek sebagai penjaga adat, serta nilai gotong royong.
Minggu 5-6: Sungai Indragiri Sumber Kehidupan - mengenal manfaat sungai, transportasi sampan, bahaya banjir, dan pentingnya menjaga kebersihan sungai dari sampah plastik.
Minggu 7-8: Pasar Tani Mini - mengenal konsep jual beli, bilangan 1-10, nilai mata uang dari daun pisang, serta adab berdagang secara jujur ala Melayu.
Minggu 9-10: Seni Melayu - mengenal zapin, pantun, batik Riau motif pucuk rebung, dan anyaman pandan.
Minggu 11-12: Alam Sekitarku - mengenal musim hujan dan kemarau, binatang di kebun sawit (ulat, belalang, burung), dan tanaman toga.
ATP ini bersifat fleksibel dan dapat disesuaikan dengan minat anak yang muncul secara emergen.

C. Modul Ajar Deep Learning PAUD - Transkripsi Struktur

Modul Ajar di ${e.nama} tidak kaku seperti Rencana Pelaksanaan Pembelajaran Harian (RPPH) lama yang administratif. Struktur modul ajar deep learning meliputi:
1. Informasi Umum: Identitas modul (Topik, Fase Fondasi, Jumlah anak, Alokasi waktu, Profil Lulusan yang dikuatkan, Sarana prasarana dari alam).
2. Komponen Inti: (a) Tujuan Pembelajaran yang kontekstual, (b) Pemahaman Bermakna (Big Idea) yang ingin dibangun, misalnya "Sawit memberi kehidupan tetapi harus dijaga agar tetap lestari", (c) Pertanyaan Pemantik Mindful seperti "Apa yang kamu rasakan ketika memegang biji sawit?", (d) Kegiatan Pembelajaran yang terdiri dari Awal (ritual mindful, berdoa, apersepsi), Inti (eksplorasi, elaborasi, bermain dengan 3 pilar), dan Penutup (refleksi joyful, relaksasi, dan rencana besok), (e) Asesmen yang akan dilakukan.
3. Lampiran: Media dari alam (loose parts), Lembar refleksi guru, Foto kegiatan, dan Cerita anak.

Contoh Modul Ajar Lengkap: "Mengapa Perahu Tidak Tenggelam?"
Pemantik Mindful: Guru mengajak anak duduk di tepi miniatur sungai yang dibuat dari terpal, mendengarkan suara air yang dialirkan, menarik napas, dan merasakan ketenangan.
Meaningful: Guru menghubungkan dengan pengalaman anak yang pernah menyeberang Sungai Indragiri dengan sampan ayah untuk pergi ke kebun seberang. Mengapa sampan kayu tidak tenggelam? Anak diajak mencoba meletakkan daun pisang, pelepah sawit, batu, dan kayu di air. Mereka menemukan konsep terapung-tenggelam secara induktif.
Joyful: Anak berlomba membuat perahu dari daun pisang dan pelepah, menghias dengan bendera kecil, dan melayarkannya bersama sambil bernyanyi "Perahuku laju...". Tawa dan sorak gembira menjadi bagian dari penilaian sosial-emosional.
Asesmen: Guru mengambil foto berseri, menulis catatan anekdot, dan mengumpulkan hasil karya perahu sebagai portofolio.

D. Asesmen Autentik dan Dokumentasi Tumbuh Kembang

Sesuai Standar Proses Permendikdasmen 1/2026, asesmen PAUD bersifat autentik, holistik, dan bukan tes. Asesmen tidak boleh membuat anak stres.
1. Asesmen Awal (Diagnostik): Dilakukan saat Masa Pengenalan Lingkungan Sekolah (MPLS) selama 2 minggu. Melalui observasi bermain bebas, wawancara mendalam dengan orang tua tentang kebiasaan di rumah, bahasa ibu, pengalaman ke kebun/sungai, makanan kesukaan, ketakutan, dan kebutuhan khusus. Hasilnya menjadi dasar penyusunan TP yang berdiferensiasi.
2. Asesmen Formatif (Selama Proses): Dilakukan setiap hari tanpa anak sadar sedang dinilai. Instrumennya: catatan anekdot harian yang naratif, hasil karya anak yang asli, foto dan video kegiatan, serta ceklis perkembangan yang diisi dengan narasi, bukan angka. Contoh catatan anekdot yang baik: "Hari ini, Selasa 12 Agustus 2025, Fatimah (5 tahun 4 bulan) dengan penuh kesadaran (mindful) mengamati ulat di daun sawit selama 7 menit tanpa diganggu, ia bertanya 'Bu, kenapa ulat gatal?'. Ia kemudian menghubungkan (meaningful) dengan cerita ibunya di rumah tentang gatal karena ulat bulu. Ia tampak gembira (joyful) ketika berhasil memindahkan ulat dengan ranting tanpa menyentuh langsung. Perkembangan: rasa ingin tahu tinggi, bahasa ekspresif baik, empati pada makhluk hidup".
3. Asesmen Sumatif (Akhir Semester): Berupa rangkuman naratif perkembangan per elemen CP, dilengkapi dengan portofolio, foto proyek P5, dan narasi tentang 8 dimensi profil lulusan. Rapor sumatif disampaikan saat pertemuan orang tua dengan bahasa yang mudah dipahami, memotivasi, dan menghargai, bukan menghakimi atau membandingkan antar anak. Dokumen tumbuh kembang disimpan dalam folder "Jejak Belajar Ananda" yang menjadi kenangan keluarga.

E. Strategi Diferensiasi dan Inklusi

Mengingat keragaman kemampuan, minat, dan latar belakang keluarga petani, guru menyiapkan tiga level tantangan dalam satu kegiatan (differentiation). Misalnya pada kegiatan menghitung janjang sawit: Level 1 (bagi yang baru): menghitung 1-5 dengan bantuan, Level 2: menghitung 1-10 dan mengelompokkan berdasarkan ukuran, Level 3: membuat grafik sederhana jumlah janjang besar dan kecil. Anak berkebutuhan khusus didampingi dengan pendekatan inklusif, bekerja sama dengan Puskesmas dan orang tua. Tidak ada anak yang ditinggalkan.`}function Ml(e){return`BAB VI - PENDAMPINGAN, PENGASUHAN, DAN KEMITRAAN

A. Peran Guru sebagai Fasilitator Pembelajaran Mendalam

Paradigma deep learning menuntut perubahan peran guru dari penceramah yang mentransfer pengetahuan menjadi fasilitator, teman bermain, dan peneliti cilik yang menemani perjalanan belajar anak. Di ${e.nama}, guru diharapkan memiliki empat kompetensi utama:
1. Hadir Penuh (Mindful Presence): Guru datang lebih awal, menyambut anak di pintu dengan senyum tulus, menyebut nama anak dengan lembut, melakukan kontak mata sejajar, dan mendengarkan cerita anak tanpa menyela. Kehadiran penuh ini menciptakan rasa aman yang menjadi prasyarat belajar. Guru juga melatih kesadaran diri dengan refleksi napas sebelum kelas dimulai.
2. Mengajukan Pertanyaan Terbuka Tingkat Tinggi: Guru tidak memberi jawaban instan, tetapi mengajukan pertanyaan yang memancing berpikir kritis. Contoh: "Menurutmu, apa yang akan terjadi kalau sampah kita buang ke Sungai Indragiri setiap hari? Bagaimana perasaan ikan patin?", "Bagaimana caranya agar biji karet ini tidak berserakan?", "Kalau kamu jadi petani sawit, apa yang akan kamu lakukan agar tanah tetap subur?". Pertanyaan terbuka menumbuhkan penalaran kritis dan kreativitas.
3. Mendokumentasikan, Bukan Menghakimi: Guru menghargai proses coretan anak sebagai bentuk literasi awal yang sah (emergent writing). Guru tidak mencoret hasil karya anak dengan tinta merah, tidak membandingkan karya A dengan B, tidak memberi stiker hukuman. Sebaliknya, guru mendokumentasikan dengan foto, mencatat perkataan anak secara verbatim, dan memberikan deskripsi positif. Coretan yang tampak abstrak bagi orang dewasa adalah peta pikiran anak tentang kebun sawit ayahnya.
4. Refleksi Harian dan Pengembangan Diri: Setiap pulang sekolah, guru menulis satu hal yang dipelajari dari anak hari itu di jurnal refleksi. Misalnya: "Hari ini saya belajar dari Rizki bahwa daun pisang bisa menjadi payung". Refleksi ini menjadi bahan rapat mingguan.

Kode Etik Guru PAUD Deep Learning ${e.nama}: Tidak membentak, tidak mempermalukan anak di depan teman, tidak memberi label negatif (nakal, bodoh, lambat), menjaga privasi dan kerahasiaan data anak, tidak memposting foto atau video anak di media sosial tanpa izin tertulis orang tua, serta menjaga kebersihan lingkungan dengan tidak menggunakan plastik sekali pakai di kelas.

B. Prinsip Pengasuhan yang Memerdekakan dan Berbudaya Melayu

Pengasuhan di satuan PAUD harus selaras dan sinergis dengan pengasuhan di rumah, tidak bertentangan. Prinsip pengasuhan yang diterapkan adalah:
1. Kasih Sayang dengan Batasan yang Jelas (Gentle Parenting ala Melayu): Tegas dengan santun, sebagaimana pepatah Melayu "Sayang anak tangan-tangankan, sayang kampung ditinggalkan". Artinya, kasih sayang disertai dengan penanaman disiplin yang konsisten dan penuh cinta. Anak diajarkan batasan waktu bermain, giliran, dan adab, tetapi dengan bahasa yang lembut dan konsekuensi logis, bukan kekerasan.
2. Pemberian Makan Bergizi Lokal: Bekal dari rumah diutamakan makanan lokal bergizi seimbang, seperti nasi, ikan patin bakar, ayam goreng, sayur keladi, gulai pakis, buah pisang, dan air putih. Menghindari chiki, permen warna-warni, dan minuman manis berlebihan yang merusak kesehatan gigi dan konsentrasi. Sekolah menyediakan program makan bersama seminggu sekali dengan menu bubur pedas khas Melayu dan kurma.
3. Toilet Training dan Kemandirian: Dukungan toilet training dilakukan dengan sabar, tanpa paksaan, dengan menyediakan toilet ramah anak, sabun, dan air bersih. Kemandirian seperti memakai baju sendiri, mengancingkan baju teluk belanga, membereskan alat main, dan mencuci tangan dilatih melalui pembiasaan, bukan instruksi.

C. Kemitraan dengan Orang Tua - Filosofi Melayu

Kemitraan dengan orang tua bukan sekadar meminta tanda tangan rapor, tetapi membangun komunitas belajar. Strategi kemitraan di ${e.nama} meliputi:
1. Kelas Orang Tua (Parenting) 1x sebulan dengan tema bergilir yang relevan dengan konteks kebun dan Melayu: "Bermain Bermakna di Rumah Kebun dengan Barang Bekas", "Mendongeng Melayu sebelum Tidur tanpa Gawai", "Mengelola Emosi Anak Tanpa Kekerasan", "Gizi Seimbang dari Hasil Kebun", dan "Mengenal Bahaya Asap Kebakaran Lahan bagi Anak". Kelas dikemas seperti kenduri kecil, bukan seminar kaku, dengan makan bersama.
2. Buku Penghubung "Jembatan Hati": Berisi cerita harian anak yang ditulis guru dengan narasi positif dan pesan orang tua di rumah, bukan sekadar laporan checklist. Buku ini menjadi jembatan komunikasi dua arah yang hangat.
3. Hari Keluarga Melayu: Setiap 2 bulan, orang tua datang ke sekolah membawa alat dari kebun (cangkul kecil, topi petani), memasak bersama, bermain zapin bersama anak, dan berbagi cerita tentang pekerjaan mereka. Ayah yang petani sawit menjadi narasumber yang sangat dihargai, meningkatkan rasa percaya diri anak.

D. Kemitraan dengan Masyarakat Melayu Indragiri Hulu

Satuan PAUD tidak dapat berdiri sendiri, ia adalah bagian dari ekosistem desa. Kemitraan masyarakat yang dibangun meliputi:
1. Tokoh Adat, Ninik Mamak, dan Bundo Kanduang: Menjadi narasumber pantun, petatah-petitih, tata krama Melayu, dan sejarah Indragiri Hulu. Mereka diundang saat MPLS dan saat projek P5 tema "Aku Anak Melayu".
2. Penyuluh Pertanian Lapangan (PPL) Sawit dan Karet: Mengajak anak mengenal proses panen yang aman, lestari, dan ramah lingkungan, serta mengenalkan bahaya pestisida bagi anak. Penyuluh juga membantu membuat kebun edukasi sekolah.
3. Puskesmas ${e.kecamatan}: Bekerja sama untuk penyuluhan kesehatan, cek tumbuh kembang (tinggi, berat, lingkar kepala), imunisasi, penyuluhan PHBS, dan penanganan stunting. Kader posyandu dilibatkan dalam pemantauan gizi.
4. Polsek dan Koramil: Program Polisi Sahabat Anak dan Tentara Sahabat Anak, edukasi keselamatan di sungai, bahaya bermain api di lahan gambut, dan tata tertib berlalu lintas.
5. Perpustakaan Daerah Inhu dan Taman Bacaan Masyarakat: Pinjam buku cerita Melayu bergilir, serta gerakan satu anak satu buku.
6. Masjid, Musholla, dan Surau sekitar: Praktik manasik kecil, peduli lingkungan masjid, dan kegiatan Ramadhan seperti pesantren kilat PAUD.
7. Perusahaan Perkebunan Sawit sekitar: Melalui program CSR, membantu pengadaan buku, APE dari bahan alam, dan beasiswa untuk anak kurang mampu.

E. Transisi PAUD ke SD yang Menyenangkan dan Tidak Mencekam

${e.nama} membangun komunikasi intensif dengan Sekolah Dasar di sekitar Kecamatan ${e.kecamatan} untuk memastikan transisi PAUD-SD yang menyenangkan sesuai Permendikdasmen 26/2025. Prinsipnya: tidak ada tes calistung sebagai syarat masuk SD, tidak ada perpeloncoan, dan data asesmen sumatif PAUD diteruskan sebagai informasi awal bagi guru kelas 1 SD, bukan sebagai alat seleksi. Kegiatan bersama yang dilakukan: "Sehari Menjadi Anak SD" di mana kelompok B berkunjung ke SD, bermain di halaman SD, dan berkenalan dengan guru SD. Orang tua juga diberikan sosialisasi bahwa kemampuan calistung bukan satu-satunya indikator kesiapan sekolah, melainkan kematangan sosial-emosional, kemandirian, dan rasa ingin tahu. Dengan demikian, anak merasa senang, bukan takut, untuk melanjutkan pendidikan.`}function Ul(e){return`BAB VII - EVALUASI DAN PENJAMINAN MUTU INTERNAL

A. Evaluasi Pelaksanaan KSP - Transkripsi Prinsip

Evaluasi pelaksanaan Kurikulum Satuan Pendidikan bukanlah kegiatan administratif untuk menggugurkan kewajiban, melainkan proses reflektif, partisipatif, dan berkelanjutan untuk memastikan bahwa pembelajaran mendalam benar-benar terjadi dan berpihak pada anak. Di ${e.nama}, evaluasi dilakukan dengan prinsip transparan, jujur, dan memuliakan proses.

1. Evaluasi Harian: Dilakukan setiap hari setelah anak pulang, selama 10-15 menit oleh guru kelas secara mandiri maupun berpasangan. Guru melakukan refleksi dengan tiga pertanyaan kunci deep learning: Apa yang hari ini berjalan dengan mindful (apakah saya hadir penuh? apakah anak merasa didengarkan?), Apa yang berjalan dengan meaningful (apakah kegiatan terhubung dengan kehidupan anak Inhu?), Apa yang berjalan dengan joyful (apakah anak tampak gembira dan merdeka?). Hasil refleksi ditulis di jurnal harian dan menjadi dasar perbaikan untuk esok hari. Contoh: "Hari ini kegiatan menghitung biji karet kurang joyful karena terlalu lama di dalam, besok akan dibawa ke halaman".
2. Evaluasi Mingguan: Dilakukan setiap Jumat pagi melalui rapat guru selama 60 menit. Agenda: membahas catatan anekdot yang menonjol, kendala sarana prasarana (misalnya kekurangan tanah liat), rencana kegiatan minggu depan, dan berbagi praktik baik. Rapat dilakukan dengan duduk melingkar di tikar, bukan dengan hierarki, sehingga semua guru merasa didengar.
3. Evaluasi Bulanan: Melibatkan perwakilan orang tua (Komite Sekolah) dan pengawas PAUD Kecamatan ${e.kecamatan}. Membahas kepuasan orang tua, perkembangan anak yang memerlukan perhatian khusus, dan penggunaan dana BOSP.
4. Evaluasi Semester: Merupakan evaluasi komprehensif yang membandingkan tujuan tahunan yang ditetapkan di BAB III dengan capaian nyata, menganalisis Rapor Pendidikan satuan, menganalisis hasil asesmen sumatif, dan menyusun Rencana Tindak Lanjut (RTL) untuk semester berikutnya. Evaluasi semester dilakukan secara musyawarah dengan mengundang tokoh adat dan tokoh masyarakat.

Instrumen evaluasi yang digunakan meliputi: Lembar refleksi guru berbasis 3 pilar deep learning, Angket kepuasan orang tua yang ditulis dengan bahasa sederhana, Lembar observasi teman sejawat (peer observation) dengan pendekatan coaching, Portofolio anak sebagai bukti otentik, dan Foto/video dokumentasi kegiatan kontekstual.

B. Penjaminan Mutu Internal (PMI) sesuai Permendikdasmen Nomor 26 Tahun 2025 dan Standar Penjaminan Mutu

Penjaminan Mutu Internal (PMI) adalah siklus berkelanjutan untuk meningkatkan mutu layanan PAUD secara mandiri. Siklus PMI di ${e.nama} mengikuti alur: Pahami Standar - Rencanakan Peningkatan - Laksanakan - Evaluasi - Tindak Lanjut, yang merupakan siklus PPEPP.

1. Pemetaan Mutu (Pahami): Satuan melakukan pemetaan mutu awal menggunakan instrumen Akreditasi PAUD (BAN-PDM) dan Rapor Pendidikan yang dirilis Kemendikdasmen. Aspek yang dipetakan meliputi: Standar Isi, Standar Proses, Standar Pengelolaan, Standar Pendidik dan Tenaga Kependidikan, Standar Sarana Prasarana, dan Standar Penilaian. Hasil pemetaan tahun ${e.tahunAjaran} menunjukkan kekuatan pada aspek kemitraan dan kelemahan pada dokumentasi asesmen naratif.
2. Perencanaan Peningkatan Mutu: Berdasarkan hasil pemetaan, disusun rencana peningkatan mutu prioritas tahun ini: (a) Peningkatan kompetensi guru dalam menyusun modul ajar deep learning kontekstual Inhu melalui workshop internal 4 kali setahun, (b) Penambahan sudut alam dengan loose parts lokal (biji sawit, biji karet, kerang sungai, tanah gambut) agar pembelajaran lebih kaya sensorial, (c) Penguatan literasi Melayu dengan menambah 50 buku cerita baru.
3. Pelaksanaan Peningkatan Mutu: Dilaksanakan melalui pelatihan internal, mengundang narasumber dari Dinas Pendidikan Kab. Inhu, dan praktik langsung di kelas. Kepala satuan memberikan dukungan berupa waktu, anggaran, dan motivasi.
4. Audit Internal: Kepala satuan PAUD melakukan observasi kelas dengan pendekatan coaching, bukan inspeksi yang menakutkan. Observasi dilakukan dengan instrumen yang disepakati bersama, fokus pada interaksi guru-anak, bukan pada kelengkapan administratif. Hasil observasi didiskusikan secara empatik, guru diajak menemukan solusi sendiri.
5. Tindak Lanjut dan Penyusunan KSP Tahun Berikutnya: Hasil audit internal dan evaluasi semester menjadi dasar untuk merevisi KSP tahun berikutnya. KSP adalah dokumen hidup, sehingga perubahan dapat dilakukan sepanjang tahun melalui musyawarah, selama tidak bertentangan dengan regulasi Permendikdasmen. Semua dokumen evaluasi disimpan rapi sebagai bukti akuntabilitas.
